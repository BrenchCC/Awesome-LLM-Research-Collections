name: Sync Feishu Wiki

on:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "README.zh-CN.md"
      - "papers/**"
      - "notes/**"
      - "blogs/**"
      - "data/blog_shares.json"
      - "assets/**"
      - "scripts/check_readme_qmd_sync.py"
      - "scripts/sync_notes.py"
      - "scripts/sync_blog_shares.py"
      - "scripts/sync_feishu_wiki.py"
      - "scripts/feishu_wiki_sync/**"
      - "tests/**"
      - ".github/workflows/feishu-wiki-sync.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Read-only preview or apply changes"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

concurrency:
  group: feishu-wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LARKSUITE_CLI_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      LARKSUITE_CLI_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      LARKSUITE_CLI_BRAND: feishu
      LARKSUITE_CLI_STRICT_MODE: bot
      FEISHU_WIKI_SPACE_ID: ${{ vars.FEISHU_WIKI_SPACE_ID }}
      GITHUB_SHA: ${{ github.sha }}
      SYNC_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'apply' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned lark-cli and SVG converter
        run: |
          npm install --global @larksuite/cli@1.0.86
          sudo apt-get update
          sudo apt-get install --yes librsvg2-bin
          lark-cli --version
          rsvg-convert --version

      - name: Initialize ephemeral lark-cli bot profile
        env:
          LARKSUITE_CLI_CONFIG_DIR: ${{ runner.temp }}/lark-cli-feishu-wiki
        run: |
          printf '%s' "$LARKSUITE_CLI_APP_SECRET" | env \
            -u LARKSUITE_CLI_APP_ID \
            -u LARKSUITE_CLI_APP_SECRET \
            -u LARKSUITE_CLI_BRAND \
            -u LARKSUITE_CLI_STRICT_MODE \
            lark-cli profile add \
              --name feishu-wiki-ci \
              --app-id "$LARKSUITE_CLI_APP_ID" \
              --app-secret-stdin \
              --brand feishu \
              --use

      - name: Check paper and homepage synchronization
        run: python scripts/check_readme_qmd_sync.py

      - name: Check notes synchronization
        run: python scripts/sync_notes.py

      - name: Check blogs synchronization
        run: python scripts/sync_blog_shares.py

      - name: Test Feishu Wiki synchronizer
        run: python -m unittest discover -s tests -v

      - name: Validate local Feishu conversion
        run: python scripts/sync_feishu_wiki.py --check

      - name: Synchronize Feishu Wiki
        env:
          LARKSUITE_CLI_CONFIG_DIR: ${{ runner.temp }}/lark-cli-feishu-wiki
        run: python scripts/sync_feishu_wiki.py --"${SYNC_MODE}"
