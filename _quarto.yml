project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - papers/en/*.qmd
    - papers/zh/*.qmd
    - notes/en/*.qmd
    - notes/en/*/*.qmd
    - notes/zh/*.qmd
    - notes/zh/*/*.qmd
    - zh/index.qmd

website:
  title: "Awesome LLM Research Collections"
  description: "A curated collection of LLM research papers, projects, code, and model resources."
  favicon: assets/favicon.svg
  site-url: "https://brenchcc.github.io/Awesome-LLM-Research-Collections/"
  repo-url: "https://github.com/BrenchCC/Awesome-LLM-Research-Collections"
  repo-actions: [source, issue]
  page-navigation: true
  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - text: Papers
        menu:
          - href: papers/en/attention.qmd
            text: Attention
          - href: papers/en/llms.qmd
            text: LLMs
          - href: papers/en/multimodal-llms.qmd
            text: Multimodal LLMs
          - href: papers/en/embeddings.qmd
            text: Embeddings
          - href: papers/en/sft.qmd
            text: SFT
          - href: papers/en/training.qmd
            text: Training
          - href: papers/en/reinforcement-learning.qmd
            text: Reinforcement Learning
          - href: papers/en/agents-application.qmd
            text: Agents Application
          - href: papers/en/vision.qmd
            text: Vision
          - href: papers/en/auto-prompt.qmd
            text: Auto-Prompt
      - href: notes/en/index.qmd
        text: Notes
    right:
      - href: index.qmd
        text: English
      - href: zh/index.qmd
        text: 中文
      - icon: github
        href: "https://github.com/BrenchCC/Awesome-LLM-Research-Collections"
        aria-label: GitHub repository

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    smooth-scroll: true
    link-external-icon: true
    link-external-newwindow: true
