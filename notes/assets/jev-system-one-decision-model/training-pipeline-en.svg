<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <title>Two public routes for training a Jev-like decision model</title>
  <desc>Original explanatory diagram: Kev trains a general model with runtime questions; open-jev distills a fixed task into a specialist. Both calibrate separately and evaluate risk coverage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.11"/></filter>
  </defs>
  <rect width="1440" height="900" rx="32" fill="#f8fafc"/>
  <text x="70" y="68" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Training a Jev-like model: choose the capability boundary first</text>
  <text x="70" y="106" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">TypeSafe has not published Jev's recipe; these auditable community implementations are not RLCD reproductions.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="150" width="1300" height="270" rx="26" fill="#ffffff" stroke="#818cf8" stroke-width="2"/>
    <rect x="70" y="150" width="190" height="270" rx="26" fill="#312e81"/>
    <text x="106" y="205" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Route A</text>
    <text x="106" y="246" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#e0e7ff">Kev</text>
    <text x="106" y="278" font-family="Inter, Arial, sans-serif" font-size="16" fill="#c7d2fe">General decision</text>
    <text x="106" y="304" font-family="Inter, Arial, sans-serif" font-size="16" fill="#c7d2fe">model</text>
    <text x="106" y="338" font-family="Inter, Arial, sans-serif" font-size="16" fill="#c7d2fe">Runtime questions</text>
    <text x="106" y="366" font-family="Inter, Arial, sans-serif" font-size="16" fill="#c7d2fe">and options</text>

    <rect x="300" y="198" width="220" height="144" rx="18" fill="#eef2ff" stroke="#818cf8"/>
    <text x="326" y="234" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#312e81">Training record</text>
    <text x="326" y="270" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">state + typed question</text>
    <text x="326" y="300" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">criteria + hard label</text>
    <text x="326" y="328" font-family="Inter, Arial, sans-serif" font-size="15" fill="#64748b">unknown + permuted cases</text>
    <path d="M520 270H570" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="590" y="198" width="260" height="144" rx="18" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="616" y="234" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#5b21b6">Parameter update</text>
    <text x="616" y="270" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">Frozen Qwen3.5 backbone</text>
    <text x="616" y="300" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">LoRA r=16 + pointer head</text>
    <text x="616" y="328" font-family="Inter, Arial, sans-serif" font-size="15" fill="#64748b">Cross-entropy · 2 epochs</text>
    <path d="M850 270H900" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="920" y="198" width="190" height="144" rx="18" fill="#ecfeff" stroke="#0891b2"/>
    <text x="946" y="234" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#155e75">Held-out calibration</text>
    <text x="946" y="270" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">Fit temperature T</text>
    <text x="946" y="300" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">Argmax unchanged</text>
    <path d="M1110 270H1160" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1180" y="198" width="150" height="144" rx="18" fill="#dcfce7" stroke="#16a34a"/>
    <text x="1206" y="234" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#166534">Serve</text>
    <text x="1206" y="270" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">Dynamic prompts</text>
    <text x="1206" y="300" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">Typed outputs</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="460" width="1300" height="270" rx="26" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <rect x="70" y="460" width="190" height="270" rx="26" fill="#14532d"/>
    <text x="106" y="515" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Route B</text>
    <text x="106" y="556" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#dcfce7">open-jev</text>
    <text x="106" y="588" font-family="Inter, Arial, sans-serif" font-size="16" fill="#bbf7d0">Single-task</text>
    <text x="106" y="614" font-family="Inter, Arial, sans-serif" font-size="16" fill="#bbf7d0">distillation</text>
    <text x="106" y="648" font-family="Inter, Arial, sans-serif" font-size="16" fill="#bbf7d0">Fixed question</text>
    <text x="106" y="676" font-family="Inter, Arial, sans-serif" font-size="16" fill="#bbf7d0">Fixed label set</text>

    <rect x="300" y="508" width="220" height="144" rx="18" fill="#f0fdf4" stroke="#22c55e"/>
    <text x="326" y="544" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#166534">Teacher soft labels</text>
    <text x="326" y="580" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">Constrained letter token</text>
    <text x="326" y="610" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">Read log-probabilities</text>
    <text x="326" y="638" font-family="Inter, Arial, sans-serif" font-size="15" fill="#64748b">Audit teacher bias</text>
    <path d="M520 580H570" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="590" y="508" width="260" height="144" rx="18" fill="#ecfdf5" stroke="#10b981"/>
    <text x="616" y="544" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#047857">Student model</text>
    <text x="616" y="580" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">mmBERT-small ≈ 140M</text>
    <text x="616" y="610" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">KL(teacher ‖ student)</text>
    <text x="616" y="638" font-family="Inter, Arial, sans-serif" font-size="15" fill="#64748b">One student per task</text>
    <path d="M850 580H900" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="920" y="508" width="190" height="144" rx="18" fill="#ecfeff" stroke="#0891b2"/>
    <text x="946" y="544" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#155e75">500-row calibration</text>
    <text x="946" y="580" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">logits / T + b</text>
    <text x="946" y="610" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">Measure ECE / Brier</text>
    <path d="M1110 580H1160" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1180" y="508" width="150" height="144" rx="18" fill="#dcfce7" stroke="#16a34a"/>
    <text x="1206" y="544" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#166534">Serve</text>
    <text x="1206" y="580" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">Fixed task</text>
    <text x="1206" y="610" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">Low latency</text>
  </g>

  <rect x="70" y="778" width="1300" height="66" rx="18" fill="#fff7ed" stroke="#f97316"/>
  <text x="102" y="808" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#9a3412">Shared acceptance gate</text>
  <text x="102" y="833" font-family="Inter, Arial, sans-serif" font-size="16" fill="#7c2d12">OOD accuracy · NLL / Brier / ECE · confident errors · risk–coverage · missing evidence · shadow deployment</text>
  <text x="70" y="880" font-family="Inter, Arial, sans-serif" font-size="14" fill="#64748b">Original explanatory diagram · Based on public code and documentation at Kev bf07f0a and open-jev 5b2c475</text>
</svg>
