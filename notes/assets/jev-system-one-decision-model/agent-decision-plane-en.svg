<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820">
  <title>Jev as an agent decision plane</title><desc>Original explanatory diagram: a generative model handles open planning and generation, Jev handles frequent bounded judgments, and code owns permissions, arithmetic, and side effects.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".12"/></filter></defs><rect width="1440" height="820" rx="32" fill="#f8fafc"/>
  <text x="72" y="72" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Jev is not a complete agent; it is a high-frequency decision plane</text><text x="72" y="108" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">Reliability comes from separating open reasoning, fuzzy judgment, deterministic constraints, and real side effects.</text>
  <g filter="url(#s)"><rect x="420" y="156" width="600" height="120" rx="26" fill="#312e81"/><text x="462" y="202" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">System Two · LLM / Planner / Generator</text><text x="462" y="238" font-family="Inter, Arial, sans-serif" font-size="17" fill="#e0e7ff">Interpret goals, plan, generate queries, dialogue, code, and open answers</text></g><path d="M720 276V330" stroke="#475569" stroke-width="4" marker-end="url(#a)"/>
  <g filter="url(#s)"><rect x="220" y="344" width="1000" height="176" rx="28" fill="#0f172a"/><text x="266" y="392" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#fff">System One · Jev decision plane</text><text x="266" y="428" font-family="Inter, Arial, sans-serif" font-size="17" fill="#cbd5e1">Parallel judgments over one state; keep arithmetic, authority, and generation elsewhere</text><rect x="266" y="456" width="200" height="40" rx="20" fill="#312e81"/><text x="306" y="482" font-family="Inter, Arial, sans-serif" font-size="16" fill="#e0e7ff">Tool / model routing</text><rect x="486" y="456" width="200" height="40" rx="20" fill="#155e75"/><text x="522" y="482" font-family="Inter, Arial, sans-serif" font-size="16" fill="#cffafe">Trace / citation audit</text><rect x="706" y="456" width="200" height="40" rx="20" fill="#9a3412"/><text x="748" y="482" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ffedd5">Risk / escalation gate</text><rect x="926" y="456" width="240" height="40" rx="20" fill="#365314"/><text x="964" y="482" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ecfccb">Action / passage selection</text></g><path d="M720 520V574" stroke="#475569" stroke-width="4" marker-end="url(#a)"/>
  <g filter="url(#s)"><rect x="116" y="590" width="1208" height="132" rx="26" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="158" y="634" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#1e293b">Deterministic control layer</text><text x="158" y="674" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475569">Schema checks · math · access control · thresholds · budgets · rollback · timeout · retries · audit logs</text><rect x="1032" y="620" width="246" height="64" rx="16" fill="#fee2e2"/><text x="1062" y="647" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#991b1b">Real side effects</text><text x="1062" y="673" font-family="Inter, Arial, sans-serif" font-size="15" fill="#991b1b">Tool execution / approval</text></g><path d="M320 590V548H520" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/><path d="M1120 590V548H920" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
  <text x="72" y="782" font-family="Inter, Arial, sans-serif" font-size="15" fill="#64748b">Original explanatory diagram · This is an engineering pattern, not a claim about Jev's undisclosed internal architecture</text>
</svg>
