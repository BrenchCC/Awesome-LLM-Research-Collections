<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840">
  <title>Interactive choice loop for editing, drama, and games</title><desc>Original explanatory diagram: perception models extract structured state, Jev judges finite candidates, code executes, and feedback updates state; a generative model enters only when new content is required.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".12"/></filter></defs><rect width="1440" height="840" rx="32" fill="#f8fafc"/>
  <text x="72" y="72" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Jev in interactive media: choose the next step, do not generate pixels</text><text x="72" y="108" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">Video and game state first become text or JSON; Jev then judges candidate shots, branches, or actions.</text>
  <g filter="url(#s)"><rect x="72" y="176" width="290" height="202" rx="24" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="104" y="220" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#1e293b">1 · Perceive and extract</text><text x="104" y="260" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475569">ASR / VLM / engine / logs</text><text x="104" y="296" font-family="Inter, Arial, sans-serif" font-size="16" fill="#64748b">Shots, characters, affect, pacing</text><text x="104" y="326" font-family="Inter, Arial, sans-serif" font-size="16" fill="#64748b">Relations, inventory, preferences, rules</text></g><path d="M362 277H438" stroke="#475569" stroke-width="4" marker-end="url(#a)"/>
  <g filter="url(#s)"><rect x="458" y="150" width="386" height="254" rx="26" fill="#0f172a"/><text x="494" y="198" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">2 · Parallel Jev judgments</text><rect x="494" y="226" width="314" height="42" rx="12" fill="#312e81"/><text x="516" y="253" font-family="Inter, Arial, sans-serif" font-size="16" fill="#e0e7ff">Choice: shot, branch, or NPC action</text><rect x="494" y="282" width="314" height="42" rx="12" fill="#155e75"/><text x="516" y="309" font-family="Inter, Arial, sans-serif" font-size="16" fill="#cffafe">Score: pacing, continuity, character fit</text><rect x="494" y="338" width="314" height="42" rx="12" fill="#9a3412"/><text x="516" y="365" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ffedd5">Noul: unsafe? human confirmation?</text></g><path d="M844 277H920" stroke="#475569" stroke-width="4" marker-end="url(#a)"/>
  <g filter="url(#s)"><rect x="940" y="176" width="428" height="202" rx="24" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="972" y="220" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#1e293b">3 · Execute and audit</text><text x="972" y="260" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475569">Check legality, permissions, and budget</text><text x="972" y="296" font-family="Inter, Arial, sans-serif" font-size="16" fill="#64748b">Call timeline editor or game state machine</text><text x="972" y="326" font-family="Inter, Arial, sans-serif" font-size="16" fill="#64748b">Log probabilities, thresholds, choice, outcome</text></g><path d="M1154 378V472H217V394" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#a)"/><text x="546" y="504" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f766e">Views, clicks, retention, and failures update state</text>
  <g filter="url(#s)"><rect x="132" y="570" width="1176" height="162" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="174" y="616" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#1e293b">Keep two paths separate</text><rect x="174" y="644" width="500" height="58" rx="16" fill="#dcfce7"/><text x="198" y="679" font-family="Inter, Arial, sans-serif" font-size="17" fill="#166534">Candidates exist → Jev ranks, picks, or gates</text><rect x="706" y="644" width="560" height="58" rx="16" fill="#ede9fe"/><text x="730" y="679" font-family="Inter, Arial, sans-serif" font-size="17" fill="#5b21b6">Need new dialogue, shot, or level → generate, then judge</text></g><text x="72" y="798" font-family="Inter, Arial, sans-serif" font-size="15" fill="#64748b">Original explanatory diagram · Jev 1.13's public interface accepts text or JSON state, not raw video pixels</text>
</svg>
