<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780">
  <title>Boundaries among code, Jev, generative models, and people</title><desc>Original explanatory diagram: choose code, Jev, a generative model, or human review based on whether the answer space is closed, whether exact computation is possible, and the cost of failure.</desc>
  <rect width="1440" height="780" rx="32" fill="#f8fafc"/><text x="72" y="72" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Choose the component from the answer space and the cost of failure</text><text x="72" y="108" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">Jev's sweet spot: finite candidates, fuzzy judgment, frequent calls, and code that needs probabilities.</text><line x1="230" y1="642" x2="1320" y2="642" stroke="#334155" stroke-width="3"/><line x1="230" y1="642" x2="230" y2="178" stroke="#334155" stroke-width="3"/><text x="1080" y="692" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">Answer space: closed → open</text><text transform="translate(118 530) rotate(-90)" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">Failure cost / irreversibility: low → high</text>
  <rect x="270" y="444" width="270" height="158" rx="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="306" y="488" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#075985">Deterministic code</text><text x="306" y="526" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0c4a6e">Math, dates, permissions, hard rules</text><text x="306" y="558" font-family="Inter, Arial, sans-serif" font-size="16" fill="#0c4a6e">If an exact rule works, use it</text>
  <rect x="558" y="318" width="310" height="210" rx="28" fill="#0f172a" stroke="#ec4899" stroke-width="4"/><text x="600" y="366" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff">Jev</text><text x="600" y="406" font-family="Inter, Arial, sans-serif" font-size="16" fill="#cbd5e1">Route, filter, score, gate</text><text x="600" y="438" font-family="Inter, Arial, sans-serif" font-size="16" fill="#cbd5e1">Choice / Score / Noul</text><text x="600" y="470" font-family="Inter, Arial, sans-serif" font-size="16" fill="#f9a8d4">Calibrate thresholds; keep a fallback</text>
  <rect x="886" y="402" width="300" height="182" rx="26" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="924" y="448" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#5b21b6">Generative model</text><text x="924" y="488" font-family="Inter, Arial, sans-serif" font-size="16" fill="#5b21b6">Plan, explain, code, write dialogue</text><text x="924" y="520" font-family="Inter, Arial, sans-serif" font-size="16" fill="#5b21b6">Create an answer, not just select one</text>
  <rect x="960" y="202" width="310" height="150" rx="26" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="998" y="248" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#991b1b">Human / expert review</text><text x="998" y="288" font-family="Inter, Arial, sans-serif" font-size="16" fill="#991b1b">High risk, sparse labels, retained duty</text><text x="998" y="320" font-family="Inter, Arial, sans-serif" font-size="16" fill="#991b1b">Probabilities prioritize; they do not absolve</text><path d="M840 316L942 258" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 7"/><text x="662" y="254" font-family="Inter, Arial, sans-serif" font-size="16" fill="#991b1b">Escalate as confidence falls or risk rises</text><text x="72" y="742" font-family="Inter, Arial, sans-serif" font-size="15" fill="#64748b">Original explanatory diagram · Boundaries should follow offline evaluation, calibration, cost, and organizational responsibility</text>
</svg>
