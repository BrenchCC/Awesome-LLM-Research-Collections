<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760">
  <title>Jev input, parallel judgments, and code branches</title>
  <desc>Original explanatory diagram: structured state and three typed questions enter Jev, probabilistic answers return, and code chooses automatic action, more evidence, or human review.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#415a77"/></marker><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/></filter></defs>
  <rect width="1440" height="760" rx="32" fill="#f8fafc"/>
  <text x="72" y="78" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Jev's public contract: judgment in the model, authority in code</text>
  <text x="72" y="116" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">Many atomic questions read the same state independently; answers are typed values that code can compare and threshold.</text>
  <g filter="url(#shadow)"><rect x="72" y="190" width="280" height="390" rx="24" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="104" y="238" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#1e293b">state</text><text x="104" y="274" font-family="Inter, Arial, sans-serif" font-size="17" fill="#64748b">What the program knows</text><rect x="104" y="308" width="216" height="54" rx="12" fill="#eef2ff"/><text x="124" y="342" font-family="Inter, Arial, sans-serif" font-size="16" fill="#3730a3">Story, tool, user state</text><rect x="104" y="380" width="216" height="54" rx="12" fill="#ecfeff"/><text x="124" y="414" font-family="Inter, Arial, sans-serif" font-size="16" fill="#155e75">Actions and constraints</text><rect x="104" y="452" width="216" height="54" rx="12" fill="#fff7ed"/><text x="124" y="486" font-family="Inter, Arial, sans-serif" font-size="16" fill="#9a3412">Evidence and traces</text></g>
  <path d="M352 385H448" stroke="#415a77" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="468" y="168" width="390" height="438" rx="28" fill="#0f172a"/><text x="502" y="220" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#fff">Jev · System One</text><text x="502" y="252" font-family="Inter, Arial, sans-serif" font-size="16" fill="#cbd5e1">One request; parallel, isolated answers</text><rect x="502" y="292" width="322" height="78" rx="16" fill="#312e81"/><text x="526" y="324" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#e0e7ff">Choice</text><text x="526" y="350" font-family="Inter, Arial, sans-serif" font-size="15" fill="#c7d2fe">Pick one option + distribution</text><rect x="502" y="388" width="322" height="78" rx="16" fill="#155e75"/><text x="526" y="420" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#cffafe">Score</text><text x="526" y="446" font-family="Inter, Arial, sans-serif" font-size="15" fill="#a5f3fc">Position on ordered levels + distribution</text><rect x="502" y="484" width="322" height="78" rx="16" fill="#9a3412"/><text x="526" y="516" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffedd5">Noul</text><text x="526" y="542" font-family="Inter, Arial, sans-serif" font-size="15" fill="#fed7aa">Probability a statement is true, 0–1</text></g>
  <path d="M858 385H950" stroke="#415a77" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="970" y="190" width="398" height="390" rx="24" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="1002" y="238" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#1e293b">Deterministic code</text><text x="1002" y="274" font-family="Inter, Arial, sans-serif" font-size="17" fill="#64748b">Validate, compose, enforce policy</text><rect x="1002" y="310" width="334" height="62" rx="14" fill="#dcfce7" stroke="#16a34a"/><text x="1024" y="348" font-family="Inter, Arial, sans-serif" font-size="17" fill="#166534">High confidence → allowed action</text><rect x="1002" y="394" width="334" height="62" rx="14" fill="#fef3c7" stroke="#d97706"/><text x="1024" y="432" font-family="Inter, Arial, sans-serif" font-size="17" fill="#92400e">Middle band → retrieve or clarify</text><rect x="1002" y="478" width="334" height="62" rx="14" fill="#fee2e2" stroke="#dc2626"/><text x="1024" y="516" font-family="Inter, Arial, sans-serif" font-size="17" fill="#991b1b">Low confidence / high risk → review</text></g>
  <text x="72" y="686" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Boundary:</text><text x="170" y="686" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">the answer cannot leave the declared type; that guarantees shape, not semantic correctness.</text>
  <text x="72" y="722" font-family="Inter, Arial, sans-serif" font-size="15" fill="#64748b">Original explanatory diagram · Based on TypeSafe Introduction, Primitives, and Confidence documentation</text>
</svg>
