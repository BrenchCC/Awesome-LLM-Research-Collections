<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
<title id="title">Gram anchoring: match relations, not coordinates</title><desc id="desc">A two-patch example; off-diagonal entries measure patch-to-patch similarity.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#52677b"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Helvetica Neue",Arial,sans-serif} .body{font-size:25px} .small{font-size:22px;fill:#52677b}</style>
<rect width="1200" height="860" rx="24" fill="#f7f9fc"/>
<rect x="40" y="36" width="7" height="74" rx="3" fill="#087f82"/>
<text x="65" y="66" font-size="34" fill="#183047" text-anchor="start" font-weight="650">Gram anchoring: match relations, not coordinates</text>
<text x="65" y="104" font-size="22" fill="#52677b" text-anchor="start">A two-patch example; off-diagonal entries measure patch-to-patch similarity.</text>
<text x="45" y="838" font-size="16" fill="#52677b" text-anchor="start">DINO SERIES  /  BRENCH</text>
<rect x="45" y="165" width="510" height="150" rx="17" fill="#e9f7f4" stroke="#087f82" stroke-width="1.6"/>
<rect x="45" y="183" width="5" height="31" rx="2" fill="#087f82"/>
<text x="67" y="207" font-size="27" fill="#087f82" text-anchor="start" font-weight="650">Student: lower-resolution image</text>
<text x="67" y="247" font-size="23" fill="#183047" text-anchor="start">Xs : B × N × D</text>
<text x="67" y="281" font-size="23" fill="#183047" text-anchor="start">Patch features receive gradients</text>
<rect x="645" y="165" width="510" height="150" rx="17" fill="#edf3fc" stroke="#3466ae" stroke-width="1.6"/>
<rect x="645" y="183" width="5" height="31" rx="2" fill="#3466ae"/>
<text x="667" y="207" font-size="27" fill="#3466ae" text-anchor="start" font-weight="650">Gram teacher: higher resolution</text>
<text x="667" y="247" font-size="23" fill="#183047" text-anchor="start">Align the spatial grid, then normalize</text>
<text x="667" y="281" font-size="23" fill="#183047" text-anchor="start">Detach teacher features</text>
<path d="M300,315 L300,360" fill="none" stroke="#52677b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M900,315 L900,360" fill="none" stroke="#52677b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="45" y="367" width="510" height="150" rx="17" fill="#e9f7f4" stroke="#087f82" stroke-width="1.6"/>
<rect x="45" y="385" width="5" height="31" rx="2" fill="#087f82"/>
<text x="67" y="409" font-size="27" fill="#087f82" text-anchor="start" font-weight="650">Gs = normalize(Xs) · normalize(Xs)ᵀ</text>
<text x="67" y="449" font-size="23" fill="#183047" text-anchor="start">[ 1.0   0.6 ]</text>
<text x="67" y="483" font-size="23" fill="#183047" text-anchor="start">[ 0.6   1.0 ]</text>
<rect x="645" y="367" width="510" height="150" rx="17" fill="#edf3fc" stroke="#3466ae" stroke-width="1.6"/>
<rect x="645" y="385" width="5" height="31" rx="2" fill="#3466ae"/>
<text x="667" y="409" font-size="27" fill="#3466ae" text-anchor="start" font-weight="650">Gg = normalize(Xg) · normalize(Xg)ᵀ</text>
<text x="667" y="449" font-size="23" fill="#183047" text-anchor="start">[ 1.0   0.0 ]</text>
<text x="667" y="483" font-size="23" fill="#183047" text-anchor="start">[ 0.0   1.0 ]</text>
<path d="M300,517 L300,540 L490,540 L490,560" fill="none" stroke="#52677b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M900,517 L900,540 L710,540 L710,560" fill="none" stroke="#52677b" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<rect x="360" y="565" width="480" height="110" rx="17" fill="#fff5e4" stroke="#ad6b14" stroke-width="1.6"/>
<rect x="360" y="583" width="5" height="31" rx="2" fill="#ad6b14"/>
<text x="382" y="607" font-size="27" fill="#ad6b14" text-anchor="start" font-weight="650">MSE(Gs, Gg) = 0.18</text>
<text x="382" y="647" font-size="23" fill="#183047" text-anchor="start">Two 0.6² terms, divided by 4</text>
<rect x="45" y="710" width="1110" height="93" rx="14" fill="#e8edf4"/>
<text x="65" y="743" font-size="23" fill="#183047" text-anchor="start">A shared orthogonal rotation leaves Xs Q (Xs Q)ᵀ = Xs Xsᵀ unchanged.</text>
<text x="65" y="777" font-size="23" fill="#183047" text-anchor="start">The relational constraint still allows the representation space to change.</text>
</svg>