<text x="67" y="252" font-size="23" fill="#183047" text-anchor="start">Cross-view consistency</text>
<text x="67" y="286" font-size="23" fill="#183047" text-anchor="start">EMA teacher → student</text>
<text x="67" y="320" font-size="23" fill="#183047" text-anchor="start">Cross-entropy on CLS</text>
<text x="67" y="354" font-size="23" fill="#183047" text-anchor="start">Local structure can emerge</text>
<rect x="430" y="170" width="340" height="260" rx="17" fill="#e9f7f4" stroke="#087f82" stroke-width="1.6"/>
