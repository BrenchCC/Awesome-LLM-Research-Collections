<text x="452" y="212" font-size="27" fill="#087f82" text-anchor="start" font-weight="650">DINOv2 · 2023</text>
<text x="452" y="252" font-size="23" fill="#183047" text-anchor="start">Global and patch features</text>
<text x="452" y="286" font-size="23" fill="#183047" text-anchor="start">DINO + iBOT + KoLeo</text>
<text x="452" y="320" font-size="23" fill="#183047" text-anchor="start">Curated data and scaling</text>
<text x="452" y="354" font-size="23" fill="#183047" text-anchor="start">Large-to-small distillation</text>
<rect x="815" y="170" width="340" height="260" rx="17" fill="#f3eef9" stroke="#7954ab" stroke-width="1.6"/>
<rect x="815" y="188" width="5" height="31" rx="2" fill="#7954ab"/>
<text x="837" y="212" font-size="27" fill="#7954ab" text-anchor="start" font-weight="650">DINOv3 · 2025</text>
<text x="837" y="252" font-size="23" fill="#183047" text-anchor="start">Long-run local consistency</text>
<text x="837" y="286" font-size="23" fill="#183047" text-anchor="start">Larger backbone and RoPE</text>
<text x="837" y="320" font-size="23" fill="#183047" text-anchor="start">Gram structure refinement</text>
<text x="837" y="354" font-size="23" fill="#183047" text-anchor="start">Resolution and distillation</text>
