<text x="65" y="104" font-size="22" fill="#52677b" text-anchor="start">Generation, model size, registers, and distillation describe different axes.</text>
<text x="45" y="728" font-size="16" fill="#52677b" text-anchor="start">DINO SERIES  /  BRENCH</text>
