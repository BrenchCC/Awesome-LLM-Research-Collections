<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">Offline adaptation and online screenshot retrieval</title><desc id="desc">Both feature modes are supported; query and index must share one encoding recipe.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#52677b"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Helvetica Neue",Arial,sans-serif} .body{font-size:25px} .small{font-size:22px;fill:#52677b}</style>
<rect width="1200" height="920" rx="24" fill="#f7f9fc"/>
<rect x="40" y="36" width="7" height="74" rx="3" fill="#087f82"/>
<text x="65" y="66" font-size="34" fill="#183047" text-anchor="start" font-weight="650">Offline adaptation and online screenshot retrieval</text>
<text x="65" y="104" font-size="22" fill="#52677b" text-anchor="start">Both feature modes are supported; query and index must share one encoding recipe.</text>
<text x="45" y="898" font-size="16" fill="#52677b" text-anchor="start">DINO SERIES  /  BRENCH</text>
<rect x="45" y="150" width="340" height="150" rx="17" fill="#edf3fc" stroke="#3466ae" stroke-width="1.6"/>
<rect x="45" y="168" width="5" height="31" rx="2" fill="#3466ae"/>
<text x="67" y="192" font-size="27" fill="#3466ae" text-anchor="start" font-weight="650">Domain training</text>
<text x="67" y="232" font-size="23" fill="#183047" text-anchor="start">Frames + initial weights</text>
<text x="67" y="266" font-size="23" fill="#183047" text-anchor="start">DINOv2 → checkpoint</text>
<rect x="430" y="150" width="340" height="150" rx="17" fill="#e9f7f4" stroke="#087f82" stroke-width="1.6"/>
<rect x="430" y="168" width="5" height="31" rx="2" fill="#087f82"/>
<text x="452" y="192" font-size="27" fill="#087f82" text-anchor="start" font-weight="650">Optional projection</text>
<text x="452" y="232" font-size="23" fill="#183047" text-anchor="start">Freeze backbone, train MLP</text>
<text x="452" y="266" font-size="23" fill="#183047" text-anchor="start">Separate checkpoint stage</text>
<rect x="815" y="150" width="340" height="150" rx="17" fill="#f3eef9" stroke="#7954ab" stroke-width="1.6"/>
<rect x="815" y="168" width="5" height="31" rx="2" fill="#7954ab"/>
<text x="837" y="192" font-size="27" fill="#7954ab" text-anchor="start" font-weight="650">Offline: build the index</text>
<text x="837" y="232" font-size="23" fill="#183047" text-anchor="start">Encode and L2-normalize</text>
<text x="837" y="266" font-size="23" fill="#183047" text-anchor="start">FAISS + frame/title IDs</text>
<path d="M385,225 L425,225" fill="none" stroke="#52677b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M770,225 L810,225" fill="none" stroke="#52677b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M215,300 L215,335 L985,335 L985,305" fill="none" stroke="#52677b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="585" y="365" font-size="22" fill="#183047" text-anchor="middle">Backbone features can also bypass the MLP</text>
<rect x="45" y="420" width="340" height="150" rx="17" fill="#edf3fc" stroke="#3466ae" stroke-width="1.6"/>
<rect x="45" y="438" width="5" height="31" rx="2" fill="#3466ae"/>
<text x="67" y="462" font-size="27" fill="#3466ae" text-anchor="start" font-weight="650">User screenshot</text>
<text x="67" y="502" font-size="23" fill="#183047" text-anchor="start">Same encoding pipeline</text>
<text x="67" y="536" font-size="23" fill="#183047" text-anchor="start">Single image: no sampling</text>
<rect x="430" y="420" width="340" height="150" rx="17" fill="#e9f7f4" stroke="#087f82" stroke-width="1.6"/>
<rect x="430" y="438" width="5" height="31" rx="2" fill="#087f82"/>
<text x="452" y="462" font-size="27" fill="#087f82" text-anchor="start" font-weight="650">Retrieve a candidate</text>
<text x="452" y="502" font-size="23" fill="#183047" text-anchor="start">Normalized query → FAISS</text>
<text x="452" y="536" font-size="23" fill="#183047" text-anchor="start">Top-1 → threshold → entity</text>
<rect x="815" y="420" width="340" height="150" rx="17" fill="#f3eef9" stroke="#7954ab" stroke-width="1.6"/>
<rect x="815" y="438" width="5" height="31" rx="2" fill="#7954ab"/>
<text x="837" y="462" font-size="27" fill="#7954ab" text-anchor="start" font-weight="650">Return the title entity</text>
<text x="837" y="502" font-size="23" fill="#183047" text-anchor="start">Fuse title/content signals</text>
<text x="837" y="536" font-size="23" fill="#183047" text-anchor="start">ID + strategy, or UNK</text>
<path d="M385,495 L425,495" fill="none" stroke="#52677b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M770,495 L810,495" fill="none" stroke="#52677b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M985,300 L1176,300 L1176,394 L600,394 L600,415" fill="none" stroke="#52677b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="45" y="630" width="530" height="165" rx="17" fill="#fff5e4" stroke="#ad6b14" stroke-width="1.6"/>
<rect x="45" y="648" width="5" height="31" rx="2" fill="#ad6b14"/>
<text x="67" y="672" font-size="27" fill="#ad6b14" text-anchor="start" font-weight="650">Vision-language branch</text>
<text x="67" y="712" font-size="23" fill="#183047" text-anchor="start">Same image → title extraction → title2id</text>
<text x="67" y="746" font-size="23" fill="#183047" text-anchor="start">Current code calls retrieval, then Doubao</text>
<path d="M215,570 L215,625" fill="none" stroke="#52677b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M575,710 L985,710 L985,575" fill="none" stroke="#52677b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="45" y="824" width="1110" height="59" rx="14" fill="#e8edf4"/>
<text x="65" y="857" font-size="23" fill="#183047" text-anchor="start">Video adds sampling and frame voting; single-image integration uses freq_thresh = 1.</text>
</svg>