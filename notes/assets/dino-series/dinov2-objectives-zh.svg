<text x="837" y="252" font-size="23" fill="#183047" text-anchor="start">学生 global CLS 特征</text>
<text x="837" y="286" font-size="23" fill="#183047" text-anchor="start">按图像划分的批内邻居</text>
<path d="M985,325 L985,368" fill="none" stroke="#52677b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="815" y="375" width="340" height="160" rx="17" fill="#f3eef9" stroke="#7954ab" stroke-width="1.6"/>
<rect x="815" y="393" width="5" height="31" rx="2" fill="#7954ab"/>
<text x="837" y="417" font-size="27" fill="#7954ab" text-anchor="start" font-weight="650">损失与作用</text>
<text x="837" y="457" font-size="23" fill="#183047" text-anchor="start">归一化特征的最近邻距离</text>
<text x="837" y="491" font-size="23" fill="#183047" text-anchor="start">避免表示挤在狭小区域</text>
<path d="M985,535 L985,575 L600,575 L600,607" fill="none" stroke="#52677b" stroke-width="2.5" marker-end="url(#arrow)"/>
