<rect x="250" y="633" width="5" height="31" rx="2" fill="#ad6b14"/>
<text x="272" y="657" font-size="27" fill="#ad6b14" text-anchor="start" font-weight="650">L = λD LDINO + λI LiBOT + λK LKoLeo</text>
<text x="600" y="683" font-size="22" fill="#183047" text-anchor="middle">归约与权重随训练阶段、实现配置核对</text>
