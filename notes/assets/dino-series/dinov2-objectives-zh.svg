<text x="65" y="104" font-size="22" fill="#52677b" text-anchor="start">教师不接受梯度；三个目标共同更新学生骨干。</text>
<text x="45" y="758" font-size="16" fill="#52677b" text-anchor="start">DINO SERIES  /  BRENCH</text>
<rect x="45" y="170" width="340" height="155" rx="17" fill="#edf3fc" stroke="#3466ae" stroke-width="1.6"/>
<rect x="45" y="188" width="5" height="31" rx="2" fill="#3466ae"/>
<text x="67" y="212" font-size="27" fill="#3466ae" text-anchor="start" font-weight="650">DINO</text>
<text x="67" y="252" font-size="23" fill="#183047" text-anchor="start">跨视图的 CLS</text>
<text x="67" y="286" font-size="23" fill="#183047" text-anchor="start">全局教师 → 学生各视图</text>
<path d="M215,325 L215,368" fill="none" stroke="#52677b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="45" y="375" width="340" height="160" rx="17" fill="#edf3fc" stroke="#3466ae" stroke-width="1.6"/>
<rect x="45" y="393" width="5" height="31" rx="2" fill="#3466ae"/>
<text x="67" y="417" font-size="27" fill="#3466ae" text-anchor="start" font-weight="650">损失与作用</text>
<text x="67" y="457" font-size="23" fill="#183047" text-anchor="start">prototype 分布交叉熵</text>
<text x="67" y="491" font-size="23" fill="#183047" text-anchor="start">学习图像语义一致性</text>
<path d="M215,535 L215,575 L600,575 L600,607" fill="none" stroke="#52677b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="430" y="170" width="340" height="155" rx="17" fill="#e9f7f4" stroke="#087f82" stroke-width="1.6"/>
<rect x="430" y="188" width="5" height="31" rx="2" fill="#087f82"/>
<text x="452" y="212" font-size="27" fill="#087f82" text-anchor="start" font-weight="650">iBOT</text>
<text x="452" y="252" font-size="23" fill="#183047" text-anchor="start">同一视图、同一 patch 位置</text>
<text x="452" y="286" font-size="23" fill="#183047" text-anchor="start">教师可见 → 学生遮挡</text>
<path d="M600,325 L600,368" fill="none" stroke="#52677b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="430" y="375" width="340" height="160" rx="17" fill="#e9f7f4" stroke="#087f82" stroke-width="1.6"/>
<rect x="430" y="393" width="5" height="31" rx="2" fill="#087f82"/>
<text x="452" y="417" font-size="27" fill="#087f82" text-anchor="start" font-weight="650">损失与作用</text>
<text x="452" y="457" font-size="23" fill="#183047" text-anchor="start">仅在 mask 位置计算交叉熵</text>
<text x="452" y="491" font-size="23" fill="#183047" text-anchor="start">恢复局部语义分布</text>
<path d="M600,535 L600,575 L600,575 L600,607" fill="none" stroke="#52677b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="815" y="170" width="340" height="155" rx="17" fill="#f3eef9" stroke="#7954ab" stroke-width="1.6"/>
