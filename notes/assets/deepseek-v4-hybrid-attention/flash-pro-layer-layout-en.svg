<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Attention layer layouts of DeepSeek-V4 Flash and Pro</title>
  <desc id="desc">Flash begins with two pure sliding-window layers, while Pro begins with two HCA layers. Both then alternate four-to-one CSA and one-hundred-twenty-eight-to-one HCA.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#52677b"/></marker></defs>
  <style>text{font-family:Inter,Arial,sans-serif}.h{font-size:32px;font-weight:700;fill:#183047}.s{font-size:19px;fill:#52677b}.b{font-size:23px;font-weight:650;fill:#183047}.n{font-size:18px;fill:#34495e}.w{font-size:18px;font-weight:650;fill:#fff}</style>
  <rect width="1200" height="700" rx="26" fill="#f7f9fc"/><rect x="44" y="38" width="7" height="70" rx="3" fill="#087f82"/><text x="70" y="70" class="h">Flash / Pro: same hybrid pattern, different opening layers</text><text x="70" y="103" class="s">Every compressed layer also carries a parallel 128-token SWA branch.</text>
  <text x="70" y="180" class="b">Flash · 43 layers · Top-512</text><text x="70" y="390" class="b">Pro · 61 layers · Top-1024</text>
  <g><rect x="70" y="215" width="190" height="92" rx="18" fill="#087f82"/><text x="165" y="250" text-anchor="middle" class="w">Layers 0–1</text><text x="165" y="279" text-anchor="middle" class="w">pure SWA</text><path d="M260 261 H330" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/><rect x="340" y="205" width="320" height="112" rx="20" fill="#3466ae"/><text x="500" y="248" text-anchor="middle" class="w">CSA · 4:1 compression</text><text x="500" y="280" text-anchor="middle" class="w">Top-512 + SWA 128</text><path d="M660 261 H730" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/><rect x="740" y="205" width="320" height="112" rx="20" fill="#ad6b14"/><text x="900" y="248" text-anchor="middle" class="w">HCA · 128:1 compression</text><text x="900" y="280" text-anchor="middle" class="w">Dense + SWA 128</text></g>
  <g><rect x="70" y="425" width="190" height="92" rx="18" fill="#ad6b14"/><text x="165" y="460" text-anchor="middle" class="w">Layers 0–1</text><text x="165" y="489" text-anchor="middle" class="w">HCA</text><path d="M260 471 H330" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/><rect x="340" y="415" width="320" height="112" rx="20" fill="#3466ae"/><text x="500" y="458" text-anchor="middle" class="w">CSA · 4:1 compression</text><text x="500" y="490" text-anchor="middle" class="w">Top-1024 + SWA 128</text><path d="M660 471 H730" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/><rect x="740" y="415" width="320" height="112" rx="20" fill="#ad6b14"/><text x="900" y="458" text-anchor="middle" class="w">HCA · 128:1 compression</text><text x="900" y="490" text-anchor="middle" class="w">Dense + SWA 128</text></g>
  <path d="M1060 261 H1115 V471 H1060" fill="none" stroke="#7954ab" stroke-width="3" marker-end="url(#a)"/><text x="1090" y="350" text-anchor="middle" class="n">alternating</text><text x="1090" y="375" text-anchor="middle" class="n">stack</text>
  <rect x="70" y="580" width="1060" height="76" rx="18" fill="#fff" stroke="#a8b8c8"/><text x="100" y="615" class="n">Key distinction: Flash has no compressed history in its first two layers; Pro uses HCA from layer 0.</text><text x="100" y="643" class="n">“Compressed layers include SWA” is not the same as “the first two layers are pure SWA.”</text>
</svg>
