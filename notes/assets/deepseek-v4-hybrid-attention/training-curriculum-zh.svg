<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek-V4 的长上下文训练课程</title><desc id="desc">预训练从四千扩展到一万六千、六万四千和一百万上下文；注意力从稠密阶段经过 Indexer 预热转为稀疏阶段；随后进行专家训练、GRPO、OPD 和 FP4 量化感知训练。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#52677b"/></marker></defs>
  <style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif}.h{font-size:32px;font-weight:700;fill:#183047}.s{font-size:19px;fill:#52677b}.b{font-size:21px;font-weight:650;fill:#183047}.n{font-size:17px;fill:#34495e}.w{font-size:18px;font-weight:650;fill:#fff}</style>
  <rect width="1200" height="690" rx="26" fill="#f7f9fc"/><rect x="44" y="38" width="7" height="70" rx="3" fill="#087f82"/><text x="70" y="70" class="h">训练课程：长度增长与稀疏化分开推进</text><text x="70" y="103" class="s">图示为报告流程摘要，不代表本文复现了训练。</text>
  <text x="65" y="176" class="b">上下文长度</text><g><rect x="235" y="140" width="170" height="68" rx="16" fill="#e9f7f4" stroke="#087f82" stroke-width="2"/><rect x="470" y="140" width="170" height="68" rx="16" fill="#e9f7f4" stroke="#087f82" stroke-width="2"/><rect x="705" y="140" width="170" height="68" rx="16" fill="#e9f7f4" stroke="#087f82" stroke-width="2"/><rect x="940" y="140" width="170" height="68" rx="16" fill="#087f82"/><g class="b" text-anchor="middle"><text x="320" y="183">4K</text><text x="555" y="183">16K</text><text x="790" y="183">64K</text></g><text x="1025" y="183" text-anchor="middle" class="w">1M</text><path d="M405 174 H460 M640 174 H695 M875 174 H930" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/></g>
  <text x="65" y="318" class="b">注意力阶段</text><rect x="235" y="275" width="250" height="88" rx="18" fill="#fff" stroke="#a8b8c8" stroke-width="2"/><text x="360" y="311" text-anchor="middle" class="b">Dense Attention</text><text x="360" y="341" text-anchor="middle" class="n">先学习主干与压缩表征</text><path d="M485 319 H545" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/><rect x="555" y="275" width="250" height="88" rx="18" fill="#edf3fc" stroke="#3466ae" stroke-width="2"/><text x="680" y="311" text-anchor="middle" class="b">Indexer warmup</text><text x="680" y="341" text-anchor="middle" class="n">对齐稠密注意力选择</text><path d="M805 319 H865" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/><rect x="875" y="275" width="235" height="88" rx="18" fill="#3466ae"/><text x="992" y="311" text-anchor="middle" class="w">Sparse Attention</text><text x="992" y="341" text-anchor="middle" class="w">Top-k 核心计算</text>
  <text x="65" y="466" class="b">稳定性措施</text><rect x="235" y="423" width="400" height="88" rx="18" fill="#fff5e4" stroke="#ad6b14" stroke-width="2"/><text x="435" y="459" text-anchor="middle" class="b">Anticipatory Routing</text><text x="435" y="489" text-anchor="middle" class="n">监测路由尖峰，必要时回滚</text><rect x="685" y="423" width="425" height="88" rx="18" fill="#fff5e4" stroke="#ad6b14" stroke-width="2"/><text x="897" y="459" text-anchor="middle" class="b">SwiGLU clamp</text><text x="897" y="489" text-anchor="middle" class="n">线性分支 [−10, 10]；门控上限 10</text>
  <text x="65" y="608" class="b">后训练 / 部署</text><g><rect x="235" y="565" width="210" height="80" rx="18" fill="#f3eef9" stroke="#7954ab" stroke-width="2"/><rect x="500" y="565" width="210" height="80" rx="18" fill="#f3eef9" stroke="#7954ab" stroke-width="2"/><rect x="765" y="565" width="345" height="80" rx="18" fill="#7954ab"/><text x="340" y="614" text-anchor="middle" class="b">Specialist GRPO</text><text x="605" y="614" text-anchor="middle" class="b">全词表 OPD</text><text x="937" y="614" text-anchor="middle" class="w">Experts + Indexer FP4 QAT</text><path d="M445 605 H490 M710 605 H755" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/></g>
</svg>
