<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">CSA 的八位置重叠压缩与稀疏选择</title><desc id="desc">前一块的 b 分支与当前块的 a 分支共同生成一个压缩 KV，然后 Lightning Indexer 选择 Top-k。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#52677b"/></marker></defs><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif}.h{font-size:32px;font-weight:700;fill:#183047}.s{font-size:19px;fill:#52677b}.b{font-size:22px;font-weight:650;fill:#183047}.n{font-size:17px;fill:#34495e}</style>
  <rect width="1200" height="760" rx="26" fill="#f7f9fc"/><rect x="44" y="38" width="7" height="70" rx="3" fill="#3466ae"/><text x="70" y="70" class="h">CSA：八位置重叠压缩，再做稀疏选择</text><text x="70" y="103" class="s">m = 4；一个压缩 entry 的感受野最多覆盖相邻两个 block。</text>
  <text x="75" y="164" class="b">前一块 B₀ 的 b 分支</text><text x="690" y="164" class="b">当前块 B₁ 的 a 分支</text>
  <g fill="#f7dfb6" stroke="#ad6b14" stroke-width="2"><rect x="70" y="190" width="120" height="64" rx="12"/><rect x="205" y="190" width="120" height="64" rx="12"/><rect x="340" y="190" width="120" height="64" rx="12"/><rect x="475" y="190" width="120" height="64" rx="12"/></g>
  <g fill="#cfe0f7" stroke="#3466ae" stroke-width="2"><rect x="680" y="190" width="120" height="64" rx="12"/><rect x="815" y="190" width="120" height="64" rx="12"/><rect x="950" y="190" width="120" height="64" rx="12"/><rect x="1085" y="190" width="80" height="64" rx="12"/></g>
  <g class="n" text-anchor="middle"><text x="130" y="230">x₀ᵇ</text><text x="265" y="230">x₁ᵇ</text><text x="400" y="230">x₂ᵇ</text><text x="535" y="230">x₃ᵇ</text><text x="740" y="230">x₄ᵃ</text><text x="875" y="230">x₅ᵃ</text><text x="1010" y="230">x₆ᵃ</text><text x="1125" y="230">x₇ᵃ</text></g>
  <path d="M130 254 V320 H600" fill="none" stroke="#52677b" stroke-width="2.5"/><path d="M1125 254 V320 H600" fill="none" stroke="#52677b" stroke-width="2.5"/><path d="M600 320 V355" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/>
  <rect x="315" y="360" width="570" height="105" rx="18" fill="#fff" stroke="#7954ab" stroke-width="2"/><text x="600" y="397" text-anchor="middle" class="b">每个 channel 在 8 个位置上独立 softmax</text><text x="600" y="430" text-anchor="middle" class="n">权重和为 1；不同 channel 可以从不同 token 提取信息</text>
  <path d="M600 465 V510" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/><rect x="415" y="515" width="370" height="66" rx="16" fill="#f3eef9" stroke="#7954ab" stroke-width="2"/><text x="600" y="557" text-anchor="middle" class="b">Cᶜᵒᵐᵖᵢ ∈ ℝ⁵¹²</text>
  <path d="M785 548 H905" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/><rect x="910" y="490" width="250" height="116" rx="18" fill="#edf3fc" stroke="#3466ae" stroke-width="2"/><text x="1035" y="530" text-anchor="middle" class="b">Lightning Indexer</text><text x="1035" y="562" text-anchor="middle" class="n">128-dim FP4 QK</text><text x="1035" y="590" text-anchor="middle" class="n">扫描 n/4 个压缩键</text>
  <path d="M1035 606 V650" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/><rect x="820" y="655" width="340" height="66" rx="16" fill="#183047"/><text x="990" y="696" text-anchor="middle" font-size="21" font-weight="650" fill="#fff">Top-k → Core MQA</text>
  <rect x="60" y="640" width="650" height="86" rx="16" fill="#fff" stroke="#a8b8c8"/><text x="85" y="673" class="n">序列长度仍压到 n/4，而非 n/8：</text><text x="85" y="704" class="n">同一原始 block 会分别通过 a/b 投影影响相邻两个压缩 entry。</text>
</svg>
