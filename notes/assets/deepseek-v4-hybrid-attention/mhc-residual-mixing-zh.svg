<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
  <title id="title">mHC 的四路残差混合</title><desc id="desc">A 将四路 residual 混成子层输入，C 将子层输出写回四路，B 对残差流做双随机混合；B 通过二十次 Sinkhorn 归一化。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#52677b"/></marker></defs>
  <style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif}.h{font-size:32px;font-weight:700;fill:#183047}.s{font-size:19px;fill:#52677b}.b{font-size:22px;font-weight:650;fill:#183047}.n{font-size:18px;fill:#34495e}.w{font-size:20px;font-weight:650;fill:#fff}</style>
  <rect width="1200" height="730" rx="26" fill="#f7f9fc"/><rect x="44" y="38" width="7" height="70" rx="3" fill="#7954ab"/><text x="70" y="70" class="h">mHC：把一条 residual stream 展开为四路</text><text x="70" y="103" class="s">更新式：X[l+1] = B[l]X[l] + C[l]F[l](A[l]X[l])，n_hc = 4。</text>
  <rect x="55" y="170" width="220" height="350" rx="22" fill="#fff" stroke="#a8b8c8" stroke-width="2"/><text x="165" y="208" text-anchor="middle" class="b">X[l]：4 路状态</text><g fill="#e9f7f4" stroke="#087f82" stroke-width="2"><rect x="92" y="245" width="146" height="42" rx="10"/><rect x="92" y="303" width="146" height="42" rx="10"/><rect x="92" y="361" width="146" height="42" rx="10"/><rect x="92" y="419" width="146" height="42" rx="10"/></g><g class="n" text-anchor="middle"><text x="165" y="273">stream 1</text><text x="165" y="331">stream 2</text><text x="165" y="389">stream 3</text><text x="165" y="447">stream 4</text></g>
  <path d="M275 300 H370" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/><rect x="380" y="245" width="185" height="108" rx="18" fill="#3466ae"/><text x="472" y="286" text-anchor="middle" class="w">A[l]：读出混合</text><text x="472" y="319" text-anchor="middle" class="w">4 → 1</text><path d="M565 299 H650" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/><rect x="660" y="245" width="185" height="108" rx="18" fill="#183047"/><text x="752" y="286" text-anchor="middle" class="w">F[l]</text><text x="752" y="319" text-anchor="middle" class="w">Attention / MoE</text><path d="M845 299 H930" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/><rect x="940" y="245" width="185" height="108" rx="18" fill="#ad6b14"/><text x="1032" y="286" text-anchor="middle" class="w">C[l]：写回混合</text><text x="1032" y="319" text-anchor="middle" class="w">1 → 4</text>
  <path d="M275 450 H450 V480 H605" fill="none" stroke="#7954ab" stroke-width="4" marker-end="url(#a)"/><rect x="615" y="425" width="250" height="108" rx="18" fill="#f3eef9" stroke="#7954ab" stroke-width="2"/><text x="740" y="466" text-anchor="middle" class="b">B[l]：4 × 4 residual 混合</text><text x="740" y="500" text-anchor="middle" class="n">非负 · 每行和每列均为 1</text><path d="M865 480 H1030 V370" fill="none" stroke="#7954ab" stroke-width="4" marker-end="url(#a)"/>
  <rect x="55" y="580" width="1090" height="105" rx="20" fill="#fff" stroke="#a8b8c8"/><text x="85" y="618" class="b">Sinkhorn-Knopp 约束</text><text x="85" y="652" class="n">对动态生成的 B[l] 交替做行归一化与列归一化 20 次，使其接近 Birkhoff 多面体。</text><text x="85" y="678" class="n">这限制 residual 混合的放大，但不等于对整个训练过程给出稳定性证明。</text>
</svg>
