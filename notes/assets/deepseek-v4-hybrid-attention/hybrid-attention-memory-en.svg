<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Three attention memories in DeepSeek-V4</title>
  <desc id="desc">SWA keeps 128 recent raw KV entries, CSA retrieves from four-to-one compressed memory, and HCA attends densely to one-hundred-and-twenty-eight-to-one compressed memory.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#52677b"/></marker></defs>
  <style>text{font-family:Inter,Arial,sans-serif}.h{font-size:32px;font-weight:700;fill:#183047}.s{font-size:19px;fill:#52677b}.b{font-size:23px;font-weight:650;fill:#183047}.n{font-size:18px;fill:#34495e}</style>
  <rect width="1200" height="720" rx="26" fill="#f7f9fc"/><rect x="44" y="38" width="7" height="70" rx="3" fill="#087f82"/>
  <text x="70" y="70" class="h">Three attention memories in DeepSeek-V4</text><text x="70" y="103" class="s">Compressed layers retain a local SWA branch; CSA and HCA handle distant history.</text>
  <rect x="55" y="150" width="1090" height="92" rx="18" fill="#fff" stroke="#a8b8c8" stroke-width="2"/><text x="90" y="188" class="b">Input history: 1,048,576 tokens</text><text x="90" y="220" class="n">A query needs recent detail, retrievable fine-grained history, and broad global summaries.</text>
  <path d="M230 242 V302" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/><path d="M600 242 V302" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/><path d="M970 242 V302" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/>
  <rect x="55" y="310" width="330" height="265" rx="22" fill="#e9f7f4" stroke="#087f82" stroke-width="2"/><text x="85" y="355" class="b" fill="#087f82">SWA: local text</text><text x="85" y="393" class="n">latest 128 raw KV entries</text><text x="85" y="430" class="n">covers the unfinished block</text><text x="85" y="467" class="n">preserves fine local detail</text><rect x="88" y="505" width="260" height="40" rx="10" fill="#bfe5dd"/><text x="218" y="532" text-anchor="middle" class="n">working set: 128</text>
  <rect x="435" y="310" width="330" height="265" rx="22" fill="#edf3fc" stroke="#3466ae" stroke-width="2"/><text x="465" y="355" class="b" fill="#3466ae">CSA: fine retrieval</text><text x="465" y="393" class="n">4:1 → 262,144 entries</text><text x="465" y="430" class="n">indexer scans compressed keys</text><text x="465" y="467" class="n">Flash 512 / Pro 1,024</text><rect x="468" y="505" width="264" height="40" rx="10" fill="#cfe0f7"/><text x="600" y="532" text-anchor="middle" class="n">core attention: Top-k + 128</text>
  <rect x="815" y="310" width="330" height="265" rx="22" fill="#fff5e4" stroke="#ad6b14" stroke-width="2"/><text x="845" y="355" class="b" fill="#ad6b14">HCA: global summary</text><text x="845" y="393" class="n">128:1 → 8,192 entries</text><text x="845" y="430" class="n">no indexer</text><text x="845" y="467" class="n">reads every compressed entry</text><rect x="848" y="505" width="264" height="40" rx="10" fill="#f7dfb6"/><text x="980" y="532" text-anchor="middle" class="n">dense MQA: 8,192 + 128</text>
  <path d="M220 575 V633 H600" fill="none" stroke="#52677b" stroke-width="3"/><path d="M600 575 V650" fill="none" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/><path d="M980 575 V633 H600" fill="none" stroke="#52677b" stroke-width="3"/>
  <rect x="420" y="650" width="360" height="48" rx="14" fill="#183047"/><text x="600" y="681" text-anchor="middle" font-size="21" font-weight="650" fill="#fff">Shared-KV Multi-Query Attention</text>
</svg>
