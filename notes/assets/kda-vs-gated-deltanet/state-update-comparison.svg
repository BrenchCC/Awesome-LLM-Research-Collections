<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">Delta rule, Gated DeltaNet, and KDA state updates</title>
  <desc id="desc">A shared predict-correct update followed by scalar state decay in Gated DeltaNet and channel-wise decay in KDA.</desc>
  <defs>
    <linearGradient id="state" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#475569"/>
    </marker>
    <style>
      .title{font:700 42px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .head{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .body{font:23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}
      .small{font:20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .math{font:24px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#172554}
      .mathsmall{font:18px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#172554}
      .white{fill:#fff}
    </style>
  </defs>
  <rect width="1800" height="980" fill="#f8fafc"/>
  <text x="900" y="68" text-anchor="middle" class="title">One associative memory, two forgetting granularities</text>

  <rect x="80" y="120" width="1640" height="250" rx="30" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="900" y="170" text-anchor="middle" class="head">Shared delta correction</text>
  <g transform="translate(100 215)">
    <rect width="400" height="96" rx="22" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <text x="200" y="40" text-anchor="middle" class="body">predict at key k[t]</text>
    <text x="200" y="75" text-anchor="middle" class="mathsmall">v_hat[t] = S_tilde[t]^T k[t]</text>
    <path d="M420 48H480" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="500" width="390" height="96" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="695" y="40" text-anchor="middle" class="body">form prediction error</text>
    <text x="695" y="75" text-anchor="middle" class="mathsmall">e[t] = v[t] - v_hat[t]</text>
    <path d="M910 48H970" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="990" width="610" height="96" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="1295" y="40" text-anchor="middle" class="body">write only the correction</text>
    <text x="1295" y="75" text-anchor="middle" class="mathsmall">S[t] = S_tilde[t] + beta k[t] e[t]^T</text>
  </g>

  <g transform="translate(80 425)">
    <rect width="780" height="430" rx="32" fill="#fff" stroke="#f59e0b" stroke-width="4"/>
    <rect width="780" height="76" rx="32" fill="#fef3c7"/><rect y="44" width="780" height="32" fill="#fef3c7"/>
    <text x="390" y="50" text-anchor="middle" class="head">Gated DeltaNet</text>
    <text x="390" y="126" text-anchor="middle" class="math">S_tilde[t] = alpha[t] S[t-1]</text>
    <g transform="translate(95 165)">
      <rect width="590" height="150" rx="18" fill="url(#state)" stroke="#475569" stroke-width="3"/>
      <path d="M0 50H590M0 100H590" stroke="#eef2ff" stroke-width="3"/>
      <text x="295" y="88" text-anchor="middle" class="head white">all rows × the same alpha[t]</text>
    </g>
    <rect x="170" y="345" width="440" height="52" rx="18" fill="#d97706"/>
    <text x="390" y="379" text-anchor="middle" class="body white">one clock per head</text>
  </g>

  <g transform="translate(940 425)">
    <rect width="780" height="430" rx="32" fill="#fff" stroke="#4f46e5" stroke-width="4"/>
    <rect width="780" height="76" rx="32" fill="#e0e7ff"/><rect y="44" width="780" height="32" fill="#e0e7ff"/>
    <text x="390" y="50" text-anchor="middle" class="head">Kimi Delta Attention</text>
    <text x="390" y="126" text-anchor="middle" class="math">S_tilde[t] = Diag(alpha[t]) S[t-1]</text>
    <g transform="translate(95 165)">
      <rect width="590" height="150" rx="18" fill="#eef2ff" stroke="#475569" stroke-width="3"/>
      <rect width="590" height="50" rx="16" fill="#c7d2fe"/>
      <rect y="50" width="590" height="50" fill="#818cf8"/>
      <rect y="100" width="590" height="50" rx="16" fill="#4338ca"/>
      <text x="295" y="34" text-anchor="middle" class="small">row 1 × alpha[t,1]</text>
      <text x="295" y="84" text-anchor="middle" class="small white">row 2 × alpha[t,2]</text>
      <text x="295" y="134" text-anchor="middle" class="small white">row d_k × alpha[t,d_k]</text>
    </g>
    <rect x="170" y="345" width="440" height="52" rx="18" fill="#4f46e5"/>
    <text x="390" y="379" text-anchor="middle" class="body white">one clock per key channel</text>
  </g>

  <text x="900" y="925" text-anchor="middle" class="body">KDA changes memory lifetime control; the finite matrix state and delta correction remain.</text>
</svg>
