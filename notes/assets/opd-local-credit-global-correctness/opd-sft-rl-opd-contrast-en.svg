<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">State distributions and supervision signals in SFT, reinforcement learning, and OPD</title>
  <desc id="desc">A three-column comparison. SFT supplies token likelihood on teacher trajectories; reinforcement learning supplies sparse outcome rewards on student-visited states; OPD evaluates the same student rollout with teacher probabilities to obtain dense distillation signals. The central difference is the visited state distribution, not whether SFT has token-level supervision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6366f1"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0f9f8f"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Arial,sans-serif">
    <text x="80" y="88" font-size="44" font-weight="700" fill="#0f172a">SFT, RL, and OPD differ first in their state distributions</text>
    <text x="80" y="136" font-size="23" fill="#475569">All three yield gradients; the question is who generates the trace and which visited states receive supervision</text>

    <g filter="url(#shadow)">
      <rect x="80" y="188" width="450" height="560" rx="28" fill="#ffffff" stroke="#c7d2fe" stroke-width="3"/>
      <rect x="575" y="188" width="450" height="560" rx="28" fill="#ffffff" stroke="#fed7aa" stroke-width="3"/>
      <rect x="1070" y="188" width="450" height="560" rx="28" fill="#ffffff" stroke="#99f6e4" stroke-width="3"/>
    </g>

    <g>
      <rect x="110" y="220" width="92" height="42" rx="21" fill="#e0e7ff"/>
      <text x="156" y="249" text-anchor="middle" font-size="22" font-weight="700" fill="#4338ca">SFT</text>
      <text x="110" y="307" font-size="20" font-weight="700" fill="#312e81">Trace source</text>
      <rect x="110" y="326" width="390" height="98" rx="18" fill="#f5f3ff"/>
      <circle cx="144" cy="364" r="15" fill="#818cf8"/>
      <text x="144" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">q</text>
      <path d="M164 364 H206" fill="none" stroke="#6366f1" stroke-width="4" marker-end="url(#arrow-indigo)"/>
      <rect x="222" y="346" width="244" height="36" rx="18" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
      <text x="344" y="371" text-anchor="middle" font-size="18" font-weight="650" fill="#4338ca">teacher trajectory  y*</text>
      <text x="130" y="407" font-size="17" fill="#64748b">Training sees expert-written prefixes</text>

      <text x="110" y="467" font-size="20" font-weight="700" fill="#312e81">Signal density</text>
      <g fill="#6366f1">
        <circle cx="139" cy="499" r="9"/><circle cx="177" cy="499" r="9"/><circle cx="215" cy="499" r="9"/>
        <circle cx="253" cy="499" r="9"/><circle cx="291" cy="499" r="9"/><circle cx="329" cy="499" r="9"/>
        <circle cx="367" cy="499" r="9"/><circle cx="405" cy="499" r="9"/><circle cx="443" cy="499" r="9"/>
      </g>
      <text x="110" y="542" font-size="18" fill="#475569">Dense, token-level likelihood</text>
      <line x1="110" y1="573" x2="500" y2="573" stroke="#e2e8f0" stroke-width="2"/>
      <text x="110" y="612" font-size="19" font-weight="700" fill="#334155">Optimization view</text>
      <text x="110" y="642" font-size="18" fill="#475569">MLE on teacher-visited states</text>
      <rect x="110" y="670" width="390" height="52" rx="15" fill="#fff7ed"/>
      <text x="130" y="702" font-size="17" fill="#9a3412">Limit: student deviations are out of distribution</text>
    </g>

    <g>
      <rect x="605" y="220" width="92" height="42" rx="21" fill="#ffedd5"/>
      <text x="651" y="249" text-anchor="middle" font-size="22" font-weight="700" fill="#c2410c">RL</text>
      <text x="605" y="307" font-size="20" font-weight="700" fill="#9a3412">Trace source</text>
      <rect x="605" y="326" width="390" height="98" rx="18" fill="#fff7ed"/>
      <circle cx="639" cy="364" r="15" fill="#fb923c"/>
      <text x="639" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">q</text>
      <path d="M659 364 H701" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow-slate)"/>
      <rect x="717" y="346" width="244" height="36" rx="18" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
      <text x="839" y="371" text-anchor="middle" font-size="18" font-weight="650" fill="#c2410c">student rollout  y ~ πθ</text>
      <text x="625" y="407" font-size="17" fill="#64748b">States come from the current student policy</text>

      <text x="605" y="467" font-size="20" font-weight="700" fill="#9a3412">Signal density</text>
      <g fill="#cbd5e1">
        <circle cx="634" cy="499" r="9"/><circle cx="672" cy="499" r="9"/><circle cx="710" cy="499" r="9"/>
        <circle cx="748" cy="499" r="9"/><circle cx="786" cy="499" r="9"/><circle cx="824" cy="499" r="9"/>
        <circle cx="862" cy="499" r="9"/><circle cx="900" cy="499" r="9"/>
      </g>
      <circle cx="938" cy="499" r="14" fill="#f97316"/>
      <text x="938" y="505" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">R</text>
      <text x="605" y="542" font-size="18" fill="#475569">Usually sparse, sequence-level outcome reward</text>
      <line x1="605" y1="573" x2="995" y2="573" stroke="#e2e8f0" stroke-width="2"/>
      <text x="605" y="612" font-size="19" font-weight="700" fill="#334155">Optimization view</text>
      <text x="605" y="642" font-size="18" fill="#475569">Improve return on student-visited states</text>
      <rect x="605" y="670" width="390" height="52" rx="15" fill="#fff7ed"/>
      <text x="625" y="702" font-size="17" fill="#9a3412">Limit: noisy credit assignment over long traces</text>
    </g>

    <g>
      <rect x="1100" y="220" width="104" height="42" rx="21" fill="#ccfbf1"/>
      <text x="1152" y="249" text-anchor="middle" font-size="22" font-weight="700" fill="#0f766e">OPD</text>
      <text x="1100" y="307" font-size="20" font-weight="700" fill="#115e59">Trace source</text>
      <rect x="1100" y="326" width="390" height="98" rx="18" fill="#f0fdfa"/>
      <circle cx="1134" cy="364" r="15" fill="#14b8a6"/>
      <text x="1134" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">q</text>
      <path d="M1154 364 H1196" fill="none" stroke="#0f9f8f" stroke-width="4" marker-end="url(#arrow-teal)"/>
      <rect x="1212" y="346" width="244" height="36" rx="18" fill="#ffffff" stroke="#5eead4" stroke-width="2"/>
      <text x="1334" y="371" text-anchor="middle" font-size="18" font-weight="650" fill="#0f766e">student rollout  y ~ πθ</text>
      <text x="1120" y="407" font-size="17" fill="#64748b">Teacher scores the same prefixes</text>

      <text x="1100" y="467" font-size="20" font-weight="700" fill="#115e59">Signal density</text>
      <g fill="#14b8a6" stroke="#f59e0b" stroke-width="4">
        <circle cx="1129" cy="499" r="9"/><circle cx="1167" cy="499" r="9"/><circle cx="1205" cy="499" r="9"/>
        <circle cx="1243" cy="499" r="9"/><circle cx="1281" cy="499" r="9"/><circle cx="1319" cy="499" r="9"/>
        <circle cx="1357" cy="499" r="9"/><circle cx="1395" cy="499" r="9"/><circle cx="1433" cy="499" r="9"/>
      </g>
      <text x="1100" y="542" font-size="18" fill="#475569">Dense, token-level teacher signal</text>
      <line x1="1100" y1="573" x2="1490" y2="573" stroke="#e2e8f0" stroke-width="2"/>
      <text x="1100" y="612" font-size="19" font-weight="700" fill="#334155">Optimization view</text>
      <text x="1100" y="642" font-size="18" fill="#475569">Often sampled log-ratio; full KL is possible</text>
      <rect x="1100" y="670" width="390" height="52" rx="15" fill="#fff7ed"/>
      <text x="1120" y="702" font-size="17" fill="#9a3412">Limit: local agreement ≠ global correctness</text>
    </g>

    <rect x="80" y="786" width="1440" height="72" rx="22" fill="#0f172a"/>
    <circle cx="122" cy="822" r="17" fill="#fbbf24"/>
    <text x="122" y="829" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">!</text>
    <text x="158" y="817" font-size="20" font-weight="700" fill="#ffffff">Correction:</text>
    <text x="276" y="817" font-size="20" fill="#cbd5e1">SFT already has token-level likelihood. OPD's distinctive move is to place a dense</text>
    <text x="276" y="844" font-size="20" fill="#cbd5e1">teacher signal on states the student actually visits.</text>
  </g>
</svg>
