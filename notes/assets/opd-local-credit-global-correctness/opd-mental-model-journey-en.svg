<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">From a distillation-as-RL intuition to a three-role model of OPD</title>
  <desc id="desc">A three-role model of OPD: the student visits states, the teacher provides local distributions, and the verifier judges global correctness, with two key distinctions in standard OPD.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="journey" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4f46e5"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#0f9f8f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Arial,sans-serif">
    <text x="82" y="92" font-size="44" font-weight="700" fill="#0f172a">Three roles and two key distinctions in OPD</text>
    <text x="82" y="139" font-size="23" fill="#475569">“Distillation as RL” is a useful entry point—not a substitute for precise state and supervision roles</text>
    <rect x="82" y="170" width="1436" height="8" rx="4" fill="url(#journey)" opacity="0.92"/>

    <g filter="url(#shadow)">
      <rect x="82" y="225" width="400" height="342" rx="28" fill="#ffffff" stroke="#c7d2fe" stroke-width="3"/>
      <rect x="112" y="255" width="140" height="38" rx="19" fill="#e0e7ff"/>
      <text x="182" y="282" text-anchor="middle" font-size="19" font-weight="700" fill="#4338ca">First intuition</text>
      <text x="112" y="346" font-size="31" font-weight="700" fill="#312e81">Distillation as RL</text>
      <text x="112" y="395" font-size="22" fill="#334155">The student generates the trace</text>
      <text x="112" y="432" font-size="22" fill="#334155">The teacher gives dense token “rewards”</text>
      <rect x="112" y="470" width="340" height="68" rx="18" fill="#eef2ff"/>
      <text x="132" y="499" font-size="18" font-weight="650" fill="#4338ca">The useful insight</text>
      <text x="132" y="526" font-size="18" fill="#475569">On-policy states + teacher-defined signal</text>

      <rect x="600" y="225" width="400" height="342" rx="28" fill="#ffffff" stroke="#fde68a" stroke-width="3"/>
      <rect x="630" y="255" width="154" height="38" rx="19" fill="#fef3c7"/>
      <text x="707" y="282" text-anchor="middle" font-size="19" font-weight="700" fill="#b45309">Key distinctions</text>
      <text x="630" y="343" font-size="24" font-weight="700" fill="#92400e">① Standard OPD has one rollout</text>
      <text x="630" y="381" font-size="19" fill="#475569">The teacher is forced on the same</text>
      <text x="630" y="411" font-size="19" fill="#475569">student prefix to compute log-probability</text>
      <line x1="630" y1="438" x2="970" y2="438" stroke="#e2e8f0" stroke-width="2"/>
      <text x="630" y="479" font-size="24" font-weight="700" fill="#92400e">② Teacher ≠ drift constraint</text>
      <text x="630" y="517" font-size="19" fill="#475569">It defines the target policy; it is not</text>
      <text x="630" y="547" font-size="19" fill="#475569">the PPO/RLHF reference model</text>

      <rect x="1118" y="225" width="400" height="342" rx="28" fill="#ffffff" stroke="#99f6e4" stroke-width="3"/>
      <rect x="1148" y="255" width="174" height="38" rx="19" fill="#ccfbf1"/>
      <text x="1235" y="282" text-anchor="middle" font-size="19" font-weight="700" fill="#0f766e">Role boundaries</text>
      <text x="1148" y="346" font-size="28" font-weight="700" fill="#115e59">Local teacher, not global judge</text>
      <text x="1148" y="397" font-size="22" fill="#334155">The teacher answers:</text>
      <text x="1148" y="434" font-size="20" fill="#475569">“What comes next under this prefix?”</text>
      <text x="1148" y="480" font-size="22" fill="#334155">It does not directly answer:</text>
      <text x="1148" y="517" font-size="20" fill="#475569">“Is the reasoning still globally correct?”</text>
    </g>

    <g fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)">
      <path d="M492 396 H580"/>
      <path d="M1010 396 H1098"/>
    </g>

    <rect x="82" y="632" width="1436" height="190" rx="28" fill="#0f172a"/>
    <text x="122" y="680" font-size="21" font-weight="700" fill="#cbd5e1">Final division of responsibility</text>
    <g>
      <rect x="122" y="710" width="400" height="78" rx="20" fill="#312e81"/>
      <circle cx="164" cy="749" r="22" fill="#818cf8"/>
      <text x="164" y="757" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">S</text>
      <text x="202" y="743" font-size="21" font-weight="700" fill="#ffffff">Student</text>
      <text x="202" y="771" font-size="16" fill="#c7d2fe">Visits states encountered at deployment</text>

      <rect x="600" y="710" width="400" height="78" rx="20" fill="#115e59"/>
      <circle cx="642" cy="749" r="22" fill="#2dd4bf"/>
      <text x="642" y="757" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">T</text>
      <text x="680" y="743" font-size="21" font-weight="700" fill="#ffffff">Teacher</text>
      <text x="680" y="771" font-size="16" fill="#99f6e4">Supplies a local conditional distribution</text>

      <rect x="1078" y="710" width="400" height="78" rx="20" fill="#92400e"/>
      <circle cx="1120" cy="749" r="22" fill="#fbbf24"/>
      <text x="1120" y="757" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">V</text>
      <text x="1158" y="743" font-size="21" font-weight="700" fill="#ffffff">Verifier</text>
      <text x="1158" y="771" font-size="16" fill="#fde68a">Judges global semantic correctness</text>
    </g>
    <text x="800" y="862" text-anchor="middle" font-size="19" fill="#64748b">Synthesis: OPD has an RL-shaped signal, while teacher supervision remains policy distillation</text>
  </g>
</svg>
