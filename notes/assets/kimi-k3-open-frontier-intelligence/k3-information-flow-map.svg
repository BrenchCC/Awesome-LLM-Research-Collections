<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Kimi K3 information-flow map</title>
  <desc id="desc">Four coordinated information-flow axes: sequence, depth, width, and modality.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef3fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172554" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <text x="64" y="72" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Kimi K3 · coordinated information flow</text>
  <text x="64" y="108" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475569">One backbone, four constraints — none of them explains the full scaling result alone</text>

  <g filter="url(#shadow)">
    <rect x="405" y="244" width="390" height="188" rx="28" fill="#111827"/>
    <text x="600" y="304" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700" fill="#ffffff">2.8T MoE backbone</text>
    <text x="600" y="344" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">104.2B active · 93 layers</text>
    <text x="600" y="380" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">shared token representation</text>
  </g>

  <g font-family="Inter,Arial,sans-serif">
    <rect x="65" y="164" width="270" height="150" rx="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="90" y="205" font-size="17" font-weight="700" fill="#1d4ed8">SEQUENCE</text>
    <text x="90" y="246" font-size="25" font-weight="700" fill="#0f172a">3 KDA + 1 MLA</text>
    <text x="90" y="278" font-size="17" fill="#334155">linear recurrence + global recall</text>

    <rect x="865" y="164" width="270" height="150" rx="22" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="890" y="205" font-size="17" font-weight="700" fill="#be185d">DEPTH</text>
    <text x="890" y="246" font-size="25" font-weight="700" fill="#0f172a">Block AttnRes</text>
    <text x="890" y="278" font-size="17" fill="#334155">selective block-state retrieval</text>

    <rect x="65" y="456" width="270" height="150" rx="22" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="90" y="497" font-size="17" font-weight="700" fill="#15803d">WIDTH</text>
    <text x="90" y="538" font-size="25" font-weight="700" fill="#0f172a">Stable LatentMoE</text>
    <text x="90" y="570" font-size="17" fill="#334155">896 routed · top-16 + shared</text>

    <rect x="865" y="456" width="270" height="150" rx="22" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
    <text x="890" y="497" font-size="17" font-weight="700" fill="#c2410c">MODALITY</text>
    <text x="890" y="538" font-size="25" font-weight="700" fill="#0f172a">MoonViT-V2</text>
    <text x="890" y="570" font-size="17" fill="#334155">native image-token training</text>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M335 239 C370 239 374 280 405 292"/>
    <path d="M865 239 C830 239 826 280 795 292"/>
    <path d="M335 531 C370 531 374 402 405 392"/>
    <path d="M865 531 C830 531 826 402 795 392"/>
  </g>
</svg>
