<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Engineering decision matrix for exploration, transfer, and control</title>
  <desc id="desc">Choose a post-training path based on four goals: capability transfer, frontier exploration, weak-model adaptation, and product behavior control.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#fff7ed"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.09"/></filter></defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="85" y="100" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="46" font-weight="700" fill="#0f172a">Choose the objective before the method</text>
  <text x="85" y="150" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" fill="#475569">One RL recipe cannot minimize transfer cost, maximize exploration, and guarantee product behavior at once</text>
  <g font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" filter="url(#shadow)">
    <rect x="85" y="220" width="690" height="250" rx="28" fill="#ffffff" stroke="#fde68a" stroke-width="3"/><circle cx="145" cy="285" r="30" fill="#fef3c7"/><text x="145" y="295" text-anchor="middle" font-size="24" font-weight="700" fill="#b45309">T</text><text x="200" y="295" font-size="30" font-weight="700" fill="#92400e">Low-cost capability transfer</text><text x="125" y="355" font-size="24" fill="#0f172a">Prefer: trace distillation / OPD</text><text x="125" y="402" font-size="20" fill="#475569">If the teacher knows it, do not make every student rediscover it</text>
    <rect x="825" y="220" width="690" height="250" rx="28" fill="#ffffff" stroke="#99f6e4" stroke-width="3"/><circle cx="885" cy="285" r="30" fill="#ccfbf1"/><text x="885" y="295" text-anchor="middle" font-size="24" font-weight="700" fill="#0f766e">E</text><text x="940" y="295" font-size="30" font-weight="700" fill="#115e59">Expand the capability frontier</text><text x="865" y="355" font-size="24" fill="#0f172a">Invest: prolonged RL + diverse environments + verifiers</text><text x="865" y="402" font-size="20" fill="#475569">Track coverage, novelty, and cross-task gains</text>
    <rect x="85" y="520" width="690" height="250" rx="28" fill="#ffffff" stroke="#c7d2fe" stroke-width="3"/><circle cx="145" cy="585" r="30" fill="#e0e7ff"/><text x="145" y="595" text-anchor="middle" font-size="24" font-weight="700" fill="#4338ca">W</text><text x="200" y="595" font-size="30" font-weight="700" fill="#312e81">Bootstrap a weak model</text><text x="125" y="655" font-size="24" fill="#0f172a">Sequence: distill / SFT cold start → RL adaptation</text><text x="125" y="702" font-size="20" fill="#475569">Enter the reachable set before optimizing on policy</text>
    <rect x="825" y="520" width="690" height="250" rx="28" fill="#ffffff" stroke="#fbcfe8" stroke-width="3"/><circle cx="885" cy="585" r="30" fill="#fce7f3"/><text x="885" y="595" text-anchor="middle" font-size="24" font-weight="700" fill="#be185d">C</text><text x="940" y="595" font-size="30" font-weight="700" fill="#9d174d">Control product behavior</text><text x="865" y="655" font-size="24" fill="#0f172a">Require: explicit rewards + sliced regression tests</text><text x="865" y="702" font-size="20" fill="#475569">Validate format, length, language, mode, and tool use separately</text>
  </g>
  <text x="800" y="842" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" fill="#64748b">Decide from the objective and the evidence, not from the method's prestige</text>
</svg>
