<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">探索、迁移与控制的工程选择矩阵</title>
  <desc id="desc">按能力迁移、边界探索、弱模型适配和产品控制四类目标选择后训练路径。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#fff7ed"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.09"/></filter></defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="85" y="100" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="46" font-weight="700" fill="#0f172a">先问目标，再选后训练方法</text>
  <text x="85" y="150" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" fill="#475569">同一套 RL 配方无法同时最小化迁移成本、最大化探索边界并保证产品行为</text>
  <g font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" filter="url(#shadow)">
    <rect x="85" y="220" width="690" height="250" rx="28" fill="#ffffff" stroke="#fde68a" stroke-width="3"/><circle cx="145" cy="285" r="30" fill="#fef3c7"/><text x="145" y="295" text-anchor="middle" font-size="26" font-weight="700" fill="#b45309">迁</text><text x="200" y="295" font-size="30" font-weight="700" fill="#92400e">低成本能力迁移</text><text x="125" y="355" font-size="24" fill="#0f172a">优先：轨迹蒸馏 / OPD</text><text x="125" y="402" font-size="20" fill="#475569">教师已经会，就不要让每个学生重新发现</text>
    <rect x="825" y="220" width="690" height="250" rx="28" fill="#ffffff" stroke="#99f6e4" stroke-width="3"/><circle cx="885" cy="285" r="30" fill="#ccfbf1"/><text x="885" y="295" text-anchor="middle" font-size="26" font-weight="700" fill="#0f766e">探</text><text x="940" y="295" font-size="30" font-weight="700" fill="#115e59">扩展能力边界</text><text x="865" y="355" font-size="24" fill="#0f172a">投入：长程 RL + 多样环境 + verifier</text><text x="865" y="402" font-size="20" fill="#475569">用覆盖率、新颖度与跨任务收益跟踪边界</text>
    <rect x="85" y="520" width="690" height="250" rx="28" fill="#ffffff" stroke="#c7d2fe" stroke-width="3"/><circle cx="145" cy="585" r="30" fill="#e0e7ff"/><text x="145" y="595" text-anchor="middle" font-size="26" font-weight="700" fill="#4338ca">弱</text><text x="200" y="595" font-size="30" font-weight="700" fill="#312e81">弱模型起步</text><text x="125" y="655" font-size="24" fill="#0f172a">顺序：蒸馏 / SFT 冷启动 → RL 适配</text><text x="125" y="702" font-size="20" fill="#475569">先进入可达区域，再优化自己的策略分布</text>
    <rect x="825" y="520" width="690" height="250" rx="28" fill="#ffffff" stroke="#fbcfe8" stroke-width="3"/><circle cx="885" cy="585" r="30" fill="#fce7f3"/><text x="885" y="595" text-anchor="middle" font-size="26" font-weight="700" fill="#be185d">控</text><text x="940" y="595" font-size="30" font-weight="700" fill="#9d174d">产品行为控制</text><text x="865" y="655" font-size="24" fill="#0f172a">必备：独立奖励 + 分桶回归评测</text><text x="865" y="702" font-size="20" fill="#475569">格式、长度、语言、模式与工具调用分别验收</text>
  </g>
  <text x="800" y="842" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" fill="#64748b">决策依据是目标与证据，不是算法名称的先进感</text>
</svg>
