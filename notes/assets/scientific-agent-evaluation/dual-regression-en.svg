<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Responsibility boundary between end-to-end and trajectory-prefix regression</title>
  <desc id="desc">One frozen version bundle enters two separate test channels. End-to-end regression starts from a clean initial state, runs the whole task, and owns the release gate. Prefix regression resumes from correct, failed, or perturbed prefixes to isolate policy, tool, and recovery problems; these conditional branch results must not be merged into end-to-end success rates.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1400" height="820" fill="#ffffff"/>
  <text x="700" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827">Two regressions, two different conditional distributions</text>
  <rect x="360" y="78" width="680" height="76" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="700" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#312e81">Frozen version bundle</text>
  <text x="700" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3730a3">Model · agent harness · prompt · tools · environment · grader</text>

  <rect x="48" y="180" width="616" height="560" rx="18" fill="#f8fafc" stroke="#2563eb" stroke-width="3"/>
  <text x="356" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">End-to-end regression</text>
  <text x="356" y="247" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">Estimates behavior from the real initial state</text>
  <rect x="155" y="285" width="402" height="68" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="356" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172554">Clean reset + complete task input</text>
  <rect x="155" y="397" width="402" height="68" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="356" y="438" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0c4a6e">Full rollout: planning, tools, recovery</text>
  <rect x="155" y="509" width="402" height="74" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="356" y="540" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#14532d">Outcome and trajectory grading</text>
  <text x="356" y="564" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#166534">Success · reliability · cost/latency · safety</text>
  <rect x="155" y="627" width="402" height="72" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <text x="356" y="659" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#7c2d12">Release gate</text>
  <text x="356" y="683" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#9a3412">The only regression distribution used for release</text>

  <rect x="736" y="180" width="616" height="560" rx="18" fill="#fdfcfb" stroke="#7c3aed" stroke-width="3"/>
  <text x="1044" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#581c87">Trajectory-prefix regression</text>
  <text x="1044" y="247" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6b21a8">Conditional diagnosis: resume after fixed history</text>

  <rect x="790" y="285" width="158" height="94" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="869" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#14532d">Correct prefix</text>
  <text x="869" y="346" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#166534">Isolate policy</text>
  <rect x="965" y="285" width="158" height="94" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="1044" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#7f1d1d">Failed prefix</text>
  <text x="1044" y="346" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#991b1b">Test recovery</text>
  <rect x="1140" y="285" width="158" height="94" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1219" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#78350f">Perturbed prefix</text>
  <text x="1219" y="346" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#92400e">Test local robustness</text>
  <rect x="840" y="448" width="408" height="88" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="1044" y="482" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#3b0764">Isolated diagnosis</text>
  <text x="1044" y="510" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#581c87">Policy · tool contract · state recovery · propagation</text>
  <rect x="840" y="602" width="408" height="98" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="3"/>
  <text x="1044" y="638" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#881337">Do not merge into end-to-end success</text>
  <text x="1044" y="665" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#9f1239">Diagnostic prefix selection changes the condition</text>
  <text x="1044" y="688" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#9f1239">Report branch coverage and recovery separately</text>

  <g stroke="#4b5563" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M560,154 L560,168 L688,168 L688,267 L356,267 L356,280"/>
    <path d="M840,154 L840,168 L712,168 L712,267 L1044,267 L1044,280"/>
    <path d="M356,353 L356,392"/>
    <path d="M356,465 L356,504"/>
    <path d="M356,583 L356,622"/>
    <path d="M869,379 L970,443"/>
    <path d="M1044,379 L1044,443"/>
    <path d="M1219,379 L1118,443"/>
    <path d="M1044,536 L1044,597"/>
  </g>
  <text x="700" y="786" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4b5563">Share version bundles and failure links; keep statistics, interpretation, and decisions separate</text>
</svg>
