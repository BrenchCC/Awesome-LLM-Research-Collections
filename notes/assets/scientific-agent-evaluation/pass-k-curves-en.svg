<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Divergence of pass@k and pass^k at a per-trial success probability of 0.60</title>
  <desc id="desc">The horizontal axis is the number of trials k and the vertical axis is probability. Blue pass@k rises from 60% toward 100%, while orange pass^k falls from 60% toward 0%. Values come from the IID formulas and illustrate the equations rather than experimental results.</desc>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111827">One per-trial success rate, two repetition questions</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#4b5563">IID formula illustration: per-trial success probability p = 0.60</text>

  <g stroke="#d1d5db" stroke-width="1">
    <line x1="120" y1="130" x2="1100" y2="130"/>
    <line x1="120" y1="240" x2="1100" y2="240"/>
    <line x1="120" y1="350" x2="1100" y2="350"/>
    <line x1="120" y1="460" x2="1100" y2="460"/>
    <line x1="120" y1="570" x2="1100" y2="570"/>
  </g>
  <g stroke="#374151" stroke-width="2">
    <line x1="120" y1="130" x2="120" y2="570"/>
    <line x1="120" y1="570" x2="1100" y2="570"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#374151">
    <text x="102" y="575" text-anchor="end">0%</text>
    <text x="102" y="465" text-anchor="end">25%</text>
    <text x="102" y="355" text-anchor="end">50%</text>
    <text x="102" y="245" text-anchor="end">75%</text>
    <text x="102" y="135" text-anchor="end">100%</text>
    <text x="610" y="635" text-anchor="middle" font-size="18">Number of trials k</text>
    <text x="32" y="350" text-anchor="middle" font-size="18" transform="rotate(-90 32 350)">Per-task probability</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#374151" text-anchor="middle">
    <text x="160" y="598">1</text><text x="290" y="598">2</text>
    <text x="420" y="598">3</text><text x="550" y="598">4</text>
    <text x="680" y="598">5</text><text x="810" y="598">6</text>
    <text x="940" y="598">7</text><text x="1070" y="598">8</text>
  </g>

  <polyline points="160,306 290,200.4 420,158.2 550,141.3 680,134.5 810,131.8 940,130.7 1070,130.3" fill="none" stroke="#2563eb" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="160,306 290,411.6 420,475 550,513 680,535.8 810,549.5 940,557.7 1070,562.6" fill="none" stroke="#c2410c" stroke-width="5" stroke-dasharray="12 9" stroke-linejoin="round" stroke-linecap="round"/>

  <g fill="#2563eb" stroke="#ffffff" stroke-width="2">
    <circle cx="160" cy="306" r="7"/><circle cx="290" cy="200.4" r="7"/>
    <circle cx="420" cy="158.2" r="7"/><circle cx="550" cy="141.3" r="7"/>
    <circle cx="680" cy="134.5" r="7"/><circle cx="810" cy="131.8" r="7"/>
    <circle cx="940" cy="130.7" r="7"/><circle cx="1070" cy="130.3" r="7"/>
  </g>
  <g fill="#c2410c" stroke="#ffffff" stroke-width="2">
    <rect x="153" y="299" width="14" height="14" rx="2"/><rect x="283" y="404.6" width="14" height="14" rx="2"/>
    <rect x="413" y="468" width="14" height="14" rx="2"/><rect x="543" y="506" width="14" height="14" rx="2"/>
    <rect x="673" y="528.8" width="14" height="14" rx="2"/><rect x="803" y="542.5" width="14" height="14" rx="2"/>
    <rect x="933" y="550.7" width="14" height="14" rx="2"/><rect x="1063" y="555.6" width="14" height="14" rx="2"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="16">
    <rect x="720" y="276" width="350" height="74" rx="10" fill="#ffffff" stroke="#d1d5db"/>
    <line x1="742" y1="300" x2="792" y2="300" stroke="#2563eb" stroke-width="5"/>
    <text x="806" y="306" fill="#1e3a8a">pass@k: at least one success</text>
    <line x1="742" y1="328" x2="792" y2="328" stroke="#c2410c" stroke-width="5" stroke-dasharray="12 9"/>
    <text x="806" y="334" fill="#7c2d12">pass^k: every trial succeeds</text>
  </g>
  <text x="600" y="675" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280">Formula illustration only; not a measured result for any model, agent, or benchmark</text>
</svg>
