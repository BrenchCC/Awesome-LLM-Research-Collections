<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">错误反馈风险传播</title>
  <desc id="desc">噪声或恶意反馈从记忆、技能工具、工作流拓扑传播到模型参数，影响范围逐层扩大。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e11d48"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#7f1d1d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="650" rx="30" fill="url(#bg)"/>
  <text x="60" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="700" fill="#0f172a">错误反馈的风险传播</text>
  <text x="60" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#475569">演化对象越接近全局策略，错误被持久化后的爆炸半径越大</text>
  <rect x="930" y="47" width="210" height="42" rx="21" fill="#ffe4e6"/>
  <text x="1035" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#be123c">本文扩展 · 非论文原图</text>

  <g filter="url(#shadow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="55" y="220" width="175" height="155" rx="22" fill="#fff1f2" stroke="#fb7185" stroke-width="3"/>
    <text x="142" y="267" text-anchor="middle" font-size="23" font-weight="700" fill="#9f1239">噪声 / 恶意反馈</text>
    <text x="142" y="307" text-anchor="middle" font-size="16" fill="#be123c">误判测试、投毒评审</text>
    <text x="142" y="336" text-anchor="middle" font-size="16" fill="#be123c">环境偶然性、错误归因</text>

    <rect x="280" y="237" width="175" height="121" rx="20" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
    <text x="367" y="281" text-anchor="middle" font-size="24" font-weight="700" fill="#78350f">记忆</text>
    <text x="367" y="317" text-anchor="middle" font-size="16" fill="#92400e">局部任务偏差</text>

    <rect x="505" y="220" width="175" height="155" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="592" y="271" text-anchor="middle" font-size="24" font-weight="700" fill="#7c2d12">技能 / 工具</text>
    <text x="592" y="307" text-anchor="middle" font-size="16" fill="#9a3412">跨任务重复执行</text>
    <text x="592" y="335" text-anchor="middle" font-size="16" fill="#9a3412">错误操作被程序化</text>

    <rect x="730" y="198" width="175" height="199" rx="20" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
    <text x="817" y="257" text-anchor="middle" font-size="24" font-weight="700" fill="#7f1d1d">工作流 / 拓扑</text>
    <text x="817" y="298" text-anchor="middle" font-size="16" fill="#991b1b">系统级路径偏移</text>
    <text x="817" y="327" text-anchor="middle" font-size="16" fill="#991b1b">角色与通信被污染</text>
    <text x="817" y="356" text-anchor="middle" font-size="16" fill="#991b1b">影响多个下游任务</text>

    <rect x="955" y="175" width="190" height="245" rx="20" fill="#4c0519" stroke="#be123c" stroke-width="3"/>
    <text x="1050" y="242" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">模型参数</text>
    <text x="1050" y="289" text-anchor="middle" font-size="16" fill="#fecdd3">全局策略漂移</text>
    <text x="1050" y="319" text-anchor="middle" font-size="16" fill="#fecdd3">难以定位与擦除</text>
    <text x="1050" y="349" text-anchor="middle" font-size="16" fill="#fecdd3">跨仓库、跨用户扩散</text>
    <rect x="987" y="374" width="126" height="28" rx="14" fill="#881337"/>
    <text x="1050" y="394" text-anchor="middle" font-size="14" font-weight="700" fill="#ffe4e6">最大爆炸半径</text>
  </g>

  <g fill="none" stroke="#e11d48" stroke-width="4" marker-end="url(#arrow)">
    <path d="M230 297 H272"/>
    <path d="M455 297 H497"/>
    <path d="M680 297 H722"/>
    <path d="M905 297 H947"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="280" y="455" width="865" height="92" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="315" y="492" font-size="18" font-weight="700" fill="#0f172a">逐层防线</text>
    <text x="410" y="492" font-size="17" fill="#475569">来源与时间戳</text>
    <text x="567" y="492" font-size="17" fill="#475569">隔离回放</text>
    <text x="685" y="492" font-size="17" fill="#475569">作用域限制</text>
    <text x="820" y="492" font-size="17" fill="#475569">灰度验证</text>
    <text x="940" y="492" font-size="17" fill="#475569">版本与回滚</text>
    <text x="315" y="524" font-size="16" fill="#64748b">越靠右，验证标准应越严格，观察窗口应越长。</text>
  </g>
  <text x="600" y="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#334155">关键问题不是“智能体能否学习”，而是“哪些反馈有资格变成长期状态”。</text>
</svg>
