<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Feedback error risk propagation</title>
  <desc id="desc">Noisy or malicious feedback propagates from memory through skills, workflow topology, and model parameters with an expanding blast radius.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e11d48"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#7f1d1d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="650" rx="30" fill="url(#bg)"/>
  <text x="60" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="700" fill="#0f172a">Risk Propagation from Bad Feedback</text>
  <text x="60" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#475569">The closer an evolved object is to global policy, the larger its persistent blast radius</text>
  <rect x="905" y="47" width="235" height="42" rx="21" fill="#ffe4e6"/>
  <text x="1022" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#be123c">Our extension · not from paper</text>

  <g filter="url(#shadow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="55" y="220" width="175" height="155" rx="22" fill="#fff1f2" stroke="#fb7185" stroke-width="3"/>
    <text x="142" y="264" text-anchor="middle" font-size="18" font-weight="700" fill="#9f1239">Noisy / malicious</text>
    <text x="142" y="290" text-anchor="middle" font-size="18" font-weight="700" fill="#9f1239">feedback</text>
    <text x="142" y="326" text-anchor="middle" font-size="14" fill="#be123c">Bad tests · poisoned review</text>
    <text x="142" y="351" text-anchor="middle" font-size="15" fill="#be123c">Spurious attribution</text>

    <rect x="280" y="237" width="175" height="121" rx="20" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
    <text x="367" y="281" text-anchor="middle" font-size="22" font-weight="700" fill="#78350f">Memory</text>
    <text x="367" y="317" text-anchor="middle" font-size="16" fill="#92400e">Local task bias</text>

    <rect x="505" y="220" width="175" height="155" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="592" y="271" text-anchor="middle" font-size="22" font-weight="700" fill="#7c2d12">Skill / tool</text>
    <text x="592" y="307" text-anchor="middle" font-size="15" fill="#9a3412">Repeated across tasks</text>
    <text x="592" y="335" text-anchor="middle" font-size="14" fill="#9a3412">Error becomes executable</text>

    <rect x="730" y="198" width="175" height="199" rx="20" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
    <text x="817" y="244" text-anchor="middle" font-size="20" font-weight="700" fill="#7f1d1d">Workflow</text>
    <text x="817" y="270" text-anchor="middle" font-size="20" font-weight="700" fill="#7f1d1d">/ topology</text>
    <text x="817" y="306" text-anchor="middle" font-size="15" fill="#991b1b">System-path drift</text>
    <text x="817" y="334" text-anchor="middle" font-size="15" fill="#991b1b">Roles and messages</text>
    <text x="817" y="362" text-anchor="middle" font-size="14" fill="#991b1b">affect downstream tasks</text>

    <rect x="955" y="175" width="190" height="245" rx="20" fill="#4c0519" stroke="#be123c" stroke-width="3"/>
    <text x="1050" y="242" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Model weights</text>
    <text x="1050" y="289" text-anchor="middle" font-size="16" fill="#fecdd3">Global policy drift</text>
    <text x="1050" y="319" text-anchor="middle" font-size="16" fill="#fecdd3">Hard to localize or erase</text>
    <text x="1050" y="349" text-anchor="middle" font-size="16" fill="#fecdd3">Cross-repo propagation</text>
    <rect x="987" y="374" width="126" height="28" rx="14" fill="#881337"/>
    <text x="1050" y="394" text-anchor="middle" font-size="14" font-weight="700" fill="#ffe4e6">Largest blast radius</text>
  </g>

  <g fill="none" stroke="#e11d48" stroke-width="4" marker-end="url(#arrow)">
    <path d="M230 297 H272"/>
    <path d="M455 297 H497"/>
    <path d="M680 297 H722"/>
    <path d="M905 297 H947"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="280" y="445" width="865" height="120" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="315" y="480" font-size="18" font-weight="700" fill="#0f172a">Layered defenses</text>
    <text x="315" y="516" font-size="15" fill="#475569">Provenance</text>
    <text x="430" y="516" font-size="15" fill="#475569">Sandbox replay</text>
    <text x="580" y="516" font-size="15" fill="#475569">Scope limits</text>
    <text x="690" y="516" font-size="15" fill="#475569">Canary</text>
    <text x="770" y="516" font-size="15" fill="#475569">Version + rollback</text>
    <text x="315" y="546" font-size="15" fill="#64748b">Moving right requires stricter gates and longer observation windows.</text>
  </g>
  <text x="600" y="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#334155">The key question is not whether an agent can learn, but which feedback may become durable state.</text>
</svg>
