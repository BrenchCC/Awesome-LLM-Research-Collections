<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">Agentic RL trajectory data contract / Agentic RL 轨迹数据契约</title>
  <desc id="desc">A bilingual two-lane diagram showing how an agent harness produces real token-level calls and how completed rollouts become grouped, scored, credited, and trainable samples. 双语流程图展示 Agent harness 如何产生真实 token 级调用，以及完整 rollout 如何形成可训练样本。</desc>
  <defs>
    <linearGradient id="top" x1="0" x2="1">
      <stop offset="0" stop-color="#edf4ff"/>
      <stop offset="1" stop-color="#f7fbff"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" x2="1">
      <stop offset="0" stop-color="#effbf7"/>
      <stop offset="1" stop-color="#f8fdfb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#15314f" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#47739c"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#337866"/>
    </marker>
    <style>
      .title { font: 700 42px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #15273b; }
      .subtitle { font: 500 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #62778c; }
      .subtitle-zh { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #62778c; }
      .lane { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2f557a; letter-spacing: 1.1px; }
      .lane-green { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #276452; letter-spacing: 1.1px; }
      .node-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17334e; }
      .compact { font-size: 15px; }
      .node-text { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4f6579; }
      .node-title-green { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #154f40; }
      .node-text-green { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4d7067; }
      .mono { font: 600 18px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #25557e; }
      .mono-green { font: 600 18px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #266b58; }
      .badge { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #91451d; }
      .audit { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5e4a20; }
    </style>
  </defs>

  <rect width="1600" height="1060" fill="#fbfcfe"/>
  <text x="90" y="82" class="title">Agentic RL: trajectory data contract / 轨迹数据契约</text>
  <text x="90" y="118" class="subtitle">Messages are runtime state. The optimizer needs the exact calls that produced each sampled token.</text>
  <text x="90" y="148" class="subtitle-zh">messages 是运行时状态；优化器需要生成每个采样 token 的精确调用记录。</text>

  <rect x="70" y="162" width="1460" height="330" rx="26" fill="url(#top)" stroke="#c6d9ec" stroke-width="2"/>
  <text x="104" y="210" class="lane">INFERENCE RUNTIME · ONE MODEL CALL / 推理运行时 · 单次模型调用</text>
  <text x="104" y="242" class="subtitle">State is adapted, encoded, sampled, parsed, and fed back into the harness.</text>
  <text x="104" y="269" class="subtitle-zh">状态依次经历适配、编码、采样、解析，并回写到 harness。</text>

  <g filter="url(#shadow)">
    <rect x="102" y="282" width="188" height="142" rx="16" fill="#ffffff" stroke="#b7cee4" stroke-width="2"/>
    <text x="124" y="324" class="node-title">Harness state / 状态</text>
    <text x="124" y="355" class="mono">Mᵢ</text>
    <text x="124" y="386" class="node-text">messages · tools</text>
    <text x="124" y="410" class="node-text">environment state</text>

    <rect x="348" y="282" width="196" height="142" rx="16" fill="#ffffff" stroke="#b7cee4" stroke-width="2"/>
    <text x="370" y="324" class="node-title">Request / 协议请求</text>
    <text x="370" y="355" class="mono">Qᵢ⁽ᵛ⁾</text>
    <text x="370" y="386" class="node-text">adapter + schema</text>
    <text x="370" y="410" class="node-text">generation settings</text>

    <rect x="602" y="282" width="205" height="142" rx="16" fill="#ffffff" stroke="#79b9b2" stroke-width="3"/>
    <text x="624" y="324" class="node-title">Actual input / 实际输入</text>
    <text x="624" y="355" class="mono">pᵢᵗᵒᵏ</text>
    <text x="624" y="386" class="node-text">tokenizer + template</text>
    <text x="624" y="410" class="node-text">real conditioning prefix</text>

    <rect x="865" y="282" width="205" height="142" rx="16" fill="#ffffff" stroke="#79b9b2" stroke-width="3"/>
    <text x="887" y="324" class="node-title">Output / 采样输出</text>
    <text x="887" y="355" class="mono">aᵢᵗᵒᵏ</text>
    <text x="887" y="386" class="node-text">completion IDs</text>
    <text x="887" y="410" class="node-text">rollout log-probs</text>

    <rect x="1128" y="282" width="190" height="142" rx="16" fill="#ffffff" stroke="#b7cee4" stroke-width="2"/>
    <text x="1150" y="324" class="node-title">Response / 解析响应</text>
    <text x="1150" y="355" class="mono">Rᵢ</text>
    <text x="1150" y="386" class="node-text">text · actions</text>
    <text x="1150" y="410" class="node-text">tool-call payload</text>

    <rect x="1376" y="282" width="120" height="142" rx="16" fill="#ffffff" stroke="#b7cee4" stroke-width="2"/>
    <text x="1388" y="324" class="node-title compact">Next / 下一状态</text>
    <text x="1398" y="355" class="mono">Mᵢ₊₁</text>
    <text x="1398" y="390" class="node-text">update</text>
  </g>
  <path d="M290 353 H340" stroke="#47739c" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M544 353 H594" stroke="#47739c" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M807 353 H857" stroke="#47739c" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1070 353 H1120" stroke="#47739c" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1318 353 H1368" stroke="#47739c" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="700" y="443" width="560" height="31" rx="15" fill="#fff2e9" stroke="#f3bd99"/>
  <text x="720" y="465" class="badge">training boundary / 训练边界: preserve pᵢᵗᵒᵏ and aᵢᵗᵒᵏ exactly</text>

  <path d="M800 505 V562" stroke="#ba7a38" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
  <text x="822" y="548" class="audit">complete calls + environment evidence / 完整调用记录与环境证据</text>

  <rect x="70" y="586" width="1460" height="388" rx="26" fill="url(#bottom)" stroke="#b9dfd3" stroke-width="2"/>
  <text x="104" y="634" class="lane-green">TRAINING DATA PIPELINE · ONE POLICY UPDATE / 训练数据管线 · 一次策略更新</text>
  <text x="104" y="666" class="subtitle">A reward is not yet a training signal. Preserve each boundary so it can be audited later.</text>
  <text x="104" y="694" class="subtitle-zh">reward 还不是训练信号；保留每个边界，才能在之后审计整条数据链。</text>

  <g filter="url(#shadow)">
    <rect x="102" y="716" width="202" height="154" rx="16" fill="#ffffff" stroke="#a8d2c4" stroke-width="2"/>
    <text x="124" y="758" class="node-title-green">Rollout / 完整轨迹</text>
    <text x="124" y="790" class="mono-green">ℛᵨ</text>
    <text x="124" y="820" class="node-text-green">task · token calls</text>
    <text x="124" y="844" class="node-text-green">environment · versions</text>

    <rect x="358" y="716" width="180" height="154" rx="16" fill="#ffffff" stroke="#a8d2c4" stroke-width="2"/>
    <text x="380" y="758" class="node-title-green">Group / rollout 分组</text>
    <text x="380" y="790" class="mono-green">𝒢ᵍ</text>
    <text x="380" y="820" class="node-text-green">same task / seed</text>
    <text x="380" y="844" class="node-text-green">comparison unit</text>

    <rect x="592" y="716" width="180" height="154" rx="16" fill="#ffffff" stroke="#a8d2c4" stroke-width="2"/>
    <text x="614" y="758" class="node-title-green">Raw score / 原始评分</text>
    <text x="614" y="790" class="mono-green">𝒮ᵍ</text>
    <text x="614" y="820" class="node-text-green">verifier output</text>
    <text x="614" y="844" class="node-text-green">immutable evidence</text>

    <rect x="826" y="716" width="180" height="154" rx="16" fill="#ffffff" stroke="#a8d2c4" stroke-width="2"/>
    <text x="848" y="758" class="node-title-green">Reward / 奖励记录</text>
    <text x="848" y="790" class="mono-green">𝒴ᵍ</text>
    <text x="848" y="820" class="node-text-green">transform / filter</text>
    <text x="848" y="844" class="node-text-green">normalization</text>

    <rect x="1060" y="716" width="180" height="154" rx="16" fill="#ffffff" stroke="#a8d2c4" stroke-width="2"/>
    <text x="1082" y="758" class="node-title-green">Credit / 信用信号</text>
    <text x="1082" y="790" class="mono-green">𝒦ᵍ</text>
    <text x="1082" y="820" class="node-text-green">return / advantage</text>
    <text x="1082" y="844" class="node-text-green">token or call level</text>

    <rect x="1294" y="716" width="202" height="154" rx="16" fill="#ffffff" stroke="#4aa68b" stroke-width="3"/>
    <text x="1316" y="758" class="node-title-green">Sample / 可训练样本</text>
    <text x="1316" y="790" class="mono-green">𝒟ᵍ</text>
    <text x="1316" y="820" class="node-text-green">IDs · masks · weights</text>
    <text x="1316" y="844" class="node-text-green">trainer input</text>
  </g>
  <path d="M304 793 H350" stroke="#337866" stroke-width="4" marker-end="url(#greenArrow)"/>
  <path d="M538 793 H584" stroke="#337866" stroke-width="4" marker-end="url(#greenArrow)"/>
  <path d="M772 793 H818" stroke="#337866" stroke-width="4" marker-end="url(#greenArrow)"/>
  <path d="M1006 793 H1052" stroke="#337866" stroke-width="4" marker-end="url(#greenArrow)"/>
  <path d="M1240 793 H1286" stroke="#337866" stroke-width="4" marker-end="url(#greenArrow)"/>

  <rect x="103" y="904" width="1392" height="42" rx="21" fill="#fff9dd" stroke="#e7d07b"/>
  <text x="130" y="931" class="audit">Audit handles / 审计链: call ID → real prefix → rollout ID → group ID → raw score → configured reward / credit → packed sample weight</text>
</svg>
