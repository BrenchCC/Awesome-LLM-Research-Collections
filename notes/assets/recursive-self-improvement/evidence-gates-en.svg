<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 650" role="img" aria-labelledby="title desc">
  <title id="title">Evidence admission gates for recursive self-improvement</title>
  <desc id="desc">A candidate update passes fixed-budget, private-test, replication, generalization, provenance, adversarial, rollback, and human-admission gates.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#516078"/></marker></defs>
  <style>
    text { font-family: Inter, "Noto Sans", "Helvetica Neue", Arial, sans-serif; fill: #172033; }
    .title { font-size: 34px; font-weight: 720; }.sub { font-size: 17px; fill: #667085; }.num { font-size: 16px; font-weight: 800; fill: #fff; }.head { font-size: 17px; font-weight: 700; }.body { font-size: 13px; fill: #596579; }.state { font-size: 20px; font-weight: 750; }
  </style>
  <rect width="1260" height="650" rx="30" fill="#f7f9fc"/>
  <text x="58" y="62" class="title">Evidence admission gates for RSI</text>
  <text x="58" y="96" class="sub">A score increase is a candidate signal; the full validation chain decides whether an update survives</text>
  <path d="M120 255 H1130" stroke="#516078" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(72 160)"><rect width="168" height="186" rx="20" fill="#fff" stroke="#9ab1cf"/><circle cx="30" cy="30" r="18" fill="#315f9f"/><text x="30" y="36" text-anchor="middle" class="num">1</text><text x="22" y="78" class="head">Fixed budget</text><text x="22" y="108" class="body">time, tokens, tools,</text><text x="22" y="132" class="body">hardware, stop rule</text><text x="22" y="163" class="body">no extra compute</text></g>
  <g transform="translate(262 160)"><rect width="168" height="186" rx="20" fill="#fff" stroke="#8bbcae"/><circle cx="30" cy="30" r="18" fill="#25866b"/><text x="30" y="36" text-anchor="middle" class="num">2</text><text x="22" y="72" class="head">Public/private</text><text x="22" y="94" class="head">split</text><text x="22" y="122" class="body">dev set guides search</text><text x="22" y="143" class="body">private tests admit</text><text x="22" y="164" class="body">block evaluation leakage</text></g>
  <g transform="translate(452 160)"><rect width="168" height="186" rx="20" fill="#fff" stroke="#d4b267"/><circle cx="30" cy="30" r="18" fill="#b47a13"/><text x="30" y="36" text-anchor="middle" class="num">3</text><text x="22" y="78" class="head">Repeated runs</text><text x="22" y="108" class="body">multi-seed rollouts</text><text x="22" y="132" class="body">variance + failure rate</text><text x="22" y="163" class="body">reject lucky winners</text></g>
  <g transform="translate(642 160)"><rect width="168" height="186" rx="20" fill="#fff" stroke="#aa95cf"/><circle cx="30" cy="30" r="18" fill="#7653aa"/><text x="30" y="36" text-anchor="middle" class="num">4</text><text x="22" y="78" class="head">Generalization</text><text x="22" y="108" class="body">unseen repositories</text><text x="22" y="132" class="body">and task families</text><text x="22" y="163" class="body">inspect worst groups</text></g>
  <g transform="translate(832 160)"><rect width="168" height="186" rx="20" fill="#fff" stroke="#d79a9a"/><circle cx="30" cy="30" r="18" fill="#b64f4f"/><text x="30" y="36" text-anchor="middle" class="num">5</text><text x="22" y="72" class="head">Provenance &amp;</text><text x="22" y="94" class="head">adversarial checks</text><text x="22" y="122" class="body">trace code and scores</text><text x="22" y="143" class="body">probe reward hacking</text><text x="22" y="164" class="body">no self-certifying verifier</text></g>
  <g transform="translate(1022 160)"><rect width="168" height="186" rx="20" fill="#fff" stroke="#769fc9"/><circle cx="30" cy="30" r="18" fill="#28669e"/><text x="30" y="36" text-anchor="middle" class="num">6</text><text x="22" y="72" class="head">Rollback &amp;</text><text x="22" y="94" class="head">admission</text><text x="22" y="122" class="body">health probes + signatures</text><text x="22" y="143" class="body">human review for risk</text><text x="22" y="164" class="body">recover on failure</text></g>
  <path d="M620 346 V430" stroke="#b64f4f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="402" y="450" width="436" height="82" rx="18" fill="#fff0f0" stroke="#d78989"/><text x="620" y="486" text-anchor="middle" class="state" fill="#a94040">Any failed gate: isolate and roll back</text><text x="620" y="514" text-anchor="middle" class="body">Record the counterexample; the same verifier cannot grant itself an exception</text>
  <rect x="907" y="430" width="283" height="122" rx="20" fill="#e8f7ef" stroke="#70b992"/><text x="1048" y="474" text-anchor="middle" class="state" fill="#247251">All gates pass</text><text x="1048" y="505" text-anchor="middle" class="body">sign, deploy, enter next round</text><text x="1048" y="529" text-anchor="middle" class="body">remain open to independent audit</text>
  <text x="58" y="608" class="sub">Strict RSI evidence must also show persistent, transferable gains that improve later improvement efficiency.</text>
</svg>
