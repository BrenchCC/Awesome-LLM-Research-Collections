<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How Grouped Query Attention reduces KV Cache</title>
  <desc id="desc">A side-by-side comparison shows multi-head attention with one key and value head per query head and grouped query attention with several query heads sharing fewer key and value heads. Query width remains high while the cached key and value state is reduced.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#334155" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="30" fill="url(#bg)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="62" y="84" font-size="48" font-weight="700" fill="#0f172a">MHA → GQA: Keep Query Width, Cache Fewer K/V Heads</text>
    <text x="62" y="128" font-size="23" fill="#475569">Qwen2 changes the organization of cached history; it does not make softmax attention linear.</text>

    <g filter="url(#shadow)">
      <rect x="62" y="190" width="686" height="526" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="852" y="190" width="686" height="526" rx="24" fill="#ffffff" stroke="#818cf8" stroke-width="2.5"/>
    </g>
    <text x="102" y="244" font-size="27" font-weight="700" fill="#334155">Qwen / Qwen1.5 · Multi-Head Attention</text>
    <text x="892" y="244" font-size="27" font-weight="700" fill="#4338ca">Qwen2 onward · Grouped Query Attention</text>

    <text x="102" y="299" font-size="20" font-weight="700" fill="#475569">QUERY HEADS</text>
    <text x="892" y="299" font-size="20" font-weight="700" fill="#475569">QUERY HEADS</text>
    <g fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5">
      <rect x="102" y="322" width="58" height="58" rx="11"/><rect x="176" y="322" width="58" height="58" rx="11"/>
      <rect x="250" y="322" width="58" height="58" rx="11"/><rect x="324" y="322" width="58" height="58" rx="11"/>
      <rect x="398" y="322" width="58" height="58" rx="11"/><rect x="472" y="322" width="58" height="58" rx="11"/>
      <rect x="546" y="322" width="58" height="58" rx="11"/><rect x="620" y="322" width="58" height="58" rx="11"/>
      <rect x="892" y="322" width="58" height="58" rx="11"/><rect x="966" y="322" width="58" height="58" rx="11"/>
      <rect x="1040" y="322" width="58" height="58" rx="11"/><rect x="1114" y="322" width="58" height="58" rx="11"/>
      <rect x="1188" y="322" width="58" height="58" rx="11"/><rect x="1262" y="322" width="58" height="58" rx="11"/>
      <rect x="1336" y="322" width="58" height="58" rx="11"/><rect x="1410" y="322" width="58" height="58" rx="11"/>
    </g>
    <g font-size="17" font-weight="700" text-anchor="middle" fill="#1e3a8a">
      <text x="131" y="358">Q1</text><text x="205" y="358">Q2</text><text x="279" y="358">Q3</text><text x="353" y="358">Q4</text>
      <text x="427" y="358">Q5</text><text x="501" y="358">Q6</text><text x="575" y="358">Q7</text><text x="649" y="358">Q8</text>
      <text x="921" y="358">Q1</text><text x="995" y="358">Q2</text><text x="1069" y="358">Q3</text><text x="1143" y="358">Q4</text>
      <text x="1217" y="358">Q5</text><text x="1291" y="358">Q6</text><text x="1365" y="358">Q7</text><text x="1439" y="358">Q8</text>
    </g>

    <text x="102" y="437" font-size="20" font-weight="700" fill="#475569">CACHED KEY / VALUE HEADS</text>
    <text x="892" y="437" font-size="20" font-weight="700" fill="#475569">CACHED KEY / VALUE HEADS</text>
    <g fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5">
      <rect x="102" y="462" width="58" height="72" rx="11"/><rect x="176" y="462" width="58" height="72" rx="11"/>
      <rect x="250" y="462" width="58" height="72" rx="11"/><rect x="324" y="462" width="58" height="72" rx="11"/>
      <rect x="398" y="462" width="58" height="72" rx="11"/><rect x="472" y="462" width="58" height="72" rx="11"/>
      <rect x="546" y="462" width="58" height="72" rx="11"/><rect x="620" y="462" width="58" height="72" rx="11"/>
      <rect x="974" y="462" width="164" height="72" rx="13" fill="#c4b5fd" stroke="#7c3aed" stroke-width="2.5"/>
      <rect x="1222" y="462" width="164" height="72" rx="13" fill="#c4b5fd" stroke="#7c3aed" stroke-width="2.5"/>
    </g>
    <g font-size="15" font-weight="700" text-anchor="middle" fill="#4c1d95">
      <text x="131" y="492">K1</text><text x="131" y="518">V1</text><text x="205" y="492">K2</text><text x="205" y="518">V2</text>
      <text x="279" y="492">K3</text><text x="279" y="518">V3</text><text x="353" y="492">K4</text><text x="353" y="518">V4</text>
      <text x="427" y="492">K5</text><text x="427" y="518">V5</text><text x="501" y="492">K6</text><text x="501" y="518">V6</text>
      <text x="575" y="492">K7</text><text x="575" y="518">V7</text><text x="649" y="492">K8</text><text x="649" y="518">V8</text>
      <text x="1056" y="492" font-size="19">K/V GROUP 1</text><text x="1056" y="519" font-size="15">shared by Q1–Q4</text>
      <text x="1304" y="492" font-size="19">K/V GROUP 2</text><text x="1304" y="519" font-size="15">shared by Q5–Q8</text>
    </g>
    <g fill="none" stroke="#94a3b8" stroke-width="2.5">
      <path d="M131 380 V410 M131 450 V462"/><path d="M205 380 V410 M205 450 V462"/><path d="M279 380 V410 M279 450 V462"/><path d="M353 380 V410 M353 450 V462"/>
      <path d="M427 380 V410 M427 450 V462"/><path d="M501 380 V410 M501 450 V462"/><path d="M575 380 V410 M575 450 V462"/><path d="M649 380 V410 M649 450 V462"/>
      <path d="M921 380 V410 H1056 V420 M1056 450 V462"/><path d="M995 380 V410 H1056"/><path d="M1069 380 V410 H1056"/><path d="M1143 380 V410 H1056"/>
      <path d="M1217 380 V410 H1304 V420 M1304 450 V462"/><path d="M1291 380 V410 H1304"/><path d="M1365 380 V410 H1304"/><path d="M1439 380 V410 H1304"/>
    </g>
    <rect x="102" y="579" width="576" height="86" rx="16" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="390" y="614" text-anchor="middle" font-size="23" font-weight="700" fill="#334155">8 query heads → 8 cached K/V heads</text>
    <text x="390" y="644" text-anchor="middle" font-size="18" fill="#475569">high cache capacity and decode bandwidth</text>
    <rect x="892" y="579" width="576" height="86" rx="16" fill="#e0e7ff" stroke="#818cf8"/>
    <text x="1180" y="614" text-anchor="middle" font-size="23" font-weight="700" fill="#3730a3">8 query heads → 2 cached K/V groups</text>
    <text x="1180" y="644" text-anchor="middle" font-size="18" fill="#475569">illustrative grouping; actual model ratios vary</text>

    <rect x="62" y="758" width="1476" height="88" rx="20" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="98" y="797" font-size="23" font-weight="700" fill="#1e3a8a">Decode consequence</text>
    <text x="340" y="797" font-size="20" fill="#334155">fewer historical K/V states to store and read → lower memory pressure and higher concurrency</text>
    <text x="98" y="827" font-size="18" fill="#475569">Prefill, FFN, communication, sampling, and scheduling costs remain; end-to-end speedup is workload-dependent.</text>
  </g>
</svg>
