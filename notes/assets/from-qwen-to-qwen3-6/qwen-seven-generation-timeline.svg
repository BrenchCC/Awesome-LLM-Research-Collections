<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Seven mainline Qwen generations with Qwen3-Next as an architectural bridge</title>
  <desc id="desc">A timeline from Qwen in 2023 through Qwen3.6 in 2026. Qwen3-Next appears below the mainline between Qwen3 and Qwen3.5 because it introduced the hybrid architecture later inherited by Qwen3.5 and Qwen3.6.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="mainCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="bridgeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .heading { font: 700 36px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subheading { font: 400 17px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .date { font: 700 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6366f1; letter-spacing: 0.08em; }
      .model { font: 700 22px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .copy { font: 400 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .axis { stroke: #94a3b8; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .tick { stroke: #64748b; stroke-width: 4; }
      .bridge { stroke: #7c3aed; stroke-width: 3; stroke-dasharray: 10 8; fill: none; marker-end: url(#bridgeArrow); }
      .bandTitle { font: 700 15px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #312e81; }
      .bandCopy { font: 400 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4338ca; }
    </style>
  </defs>

  <rect width="1600" height="820" rx="28" fill="url(#background)"/>
  <text x="64" y="66" class="heading">Qwen Mainline: Seven Numbered Generations</text>
  <text x="64" y="98" class="subheading">Qwen3-Next is shown as a bridge, not an eighth mainline generation.</text>

  <path d="M 110 300 H 1510" class="axis"/>

  <g filter="url(#shadow)">
    <rect x="55" y="150" width="190" height="125" rx="18" fill="url(#mainCard)" stroke="#a5b4fc" stroke-width="2"/>
    <text x="75" y="181" class="date">2023.08–09</text>
    <text x="75" y="216" class="model">Qwen</text>
    <text x="75" y="244" class="copy">Dense decoder · RLHF</text>
  </g>
  <line x1="150" y1="275" x2="150" y2="322" class="tick"/>

  <g filter="url(#shadow)">
    <rect x="270" y="335" width="190" height="125" rx="18" fill="url(#mainCard)" stroke="#a5b4fc" stroke-width="2"/>
    <text x="290" y="366" class="date">2024.02</text>
    <text x="290" y="401" class="model">Qwen1.5</text>
    <text x="290" y="429" class="copy">32K · DPO · MoE pilot</text>
  </g>
  <line x1="365" y1="280" x2="365" y2="335" class="tick"/>

  <g filter="url(#shadow)">
    <rect x="485" y="150" width="190" height="125" rx="18" fill="url(#mainCard)" stroke="#818cf8" stroke-width="2"/>
    <text x="505" y="181" class="date">2024.06</text>
    <text x="505" y="216" class="model">Qwen2</text>
    <text x="505" y="244" class="copy">GQA · DCA + YaRN</text>
  </g>
  <line x1="580" y1="275" x2="580" y2="322" class="tick"/>

  <g filter="url(#shadow)">
    <rect x="700" y="335" width="190" height="125" rx="18" fill="url(#mainCard)" stroke="#818cf8" stroke-width="2"/>
    <text x="720" y="366" class="date">2024.09</text>
    <text x="720" y="401" class="model">Qwen2.5</text>
    <text x="720" y="429" class="copy">18T · multistage RL</text>
  </g>
  <line x1="795" y1="280" x2="795" y2="335" class="tick"/>

  <g filter="url(#shadow)">
    <rect x="915" y="150" width="190" height="125" rx="18" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
    <text x="935" y="181" class="date">2025.04</text>
    <text x="935" y="216" class="model">Qwen3</text>
    <text x="935" y="244" class="copy">Thinking modes · 128/8 MoE</text>
  </g>
  <line x1="1010" y1="275" x2="1010" y2="322" class="tick"/>

  <g filter="url(#shadow)">
    <rect x="1130" y="335" width="190" height="125" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="1150" y="366" class="date">2026.02</text>
    <text x="1150" y="401" class="model">Qwen3.5</text>
    <text x="1150" y="429" class="copy">Native multimodal · async RL</text>
  </g>
  <line x1="1225" y1="280" x2="1225" y2="335" class="tick"/>

  <g filter="url(#shadow)">
    <rect x="1345" y="150" width="190" height="125" rx="18" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5"/>
    <text x="1365" y="181" class="date">2026.04</text>
    <text x="1365" y="216" class="model">Qwen3.6</text>
    <text x="1365" y="244" class="copy">Coding-focused post-training</text>
  </g>
  <line x1="1440" y1="275" x2="1440" y2="322" class="tick"/>

  <path d="M 1010 322 C 1010 500, 1050 520, 1115 520" class="bridge"/>
  <g filter="url(#shadow)">
    <rect x="1115" y="485" width="275" height="120" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="9 7"/>
    <text x="1138" y="518" class="date">2025.09 · ARCHITECTURE BRIDGE</text>
    <text x="1138" y="553" class="model">Qwen3-Next</text>
    <text x="1138" y="581" class="copy">Gated DeltaNet · ultra-sparse MoE · MTP</text>
  </g>
  <path d="M 1390 545 C 1450 545, 1455 438, 1315 400" class="bridge"/>

  <g>
    <rect x="60" y="675" width="1480" height="92" rx="18" fill="#e0e7ff" stroke="#a5b4fc"/>
    <text x="88" y="707" class="bandTitle">What actually changes across the line</text>
    <text x="88" y="737" class="bandCopy">data and context scale  ·  MHA → GQA → hybrid linear/full attention  ·  dense → fine-grained MoE  ·  RLHF/DPO → reasoning and agent RL  ·  text-only → native multimodal</text>
  </g>
</svg>
