<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Qwen foundation model and first-generation RLHF pipeline</title>
  <desc id="desc">A byte-level BPE tokenizer feeds a decoder-only Transformer with MHA, RoPE, RMSNorm, SwiGLU, and QKV bias. The base model then branches into supervised fine-tuning and a preference model before PPO RLHF.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#475569" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="30" fill="url(#bg)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="62" y="86" font-size="48" font-weight="700" fill="#0f172a">Qwen: A Stable Backbone, Then Layered Alignment</text>
    <text x="62" y="130" font-size="23" fill="#475569">The first generation separates representation learning, instruction following, preference modeling, and policy optimization.</text>

    <g filter="url(#shadow)">
      <rect x="64" y="205" width="320" height="470" rx="24" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    </g>
    <text x="96" y="257" font-size="22" font-weight="700" fill="#2563eb">INPUT REPRESENTATION</text>
    <rect x="96" y="292" width="256" height="92" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="224" y="329" text-anchor="middle" font-size="25" font-weight="700" fill="#1e3a8a">Byte-level BPE</text>
    <text x="224" y="360" text-anchor="middle" font-size="19" fill="#334155">≈152K vocabulary</text>
    <text x="96" y="430" font-size="21" font-weight="700" fill="#334155">WHY IT MATTERS</text>
    <text x="96" y="470" font-size="20" fill="#475569">• Fewer steps for Chinese text</text>
    <text x="96" y="507" font-size="20" fill="#475569">• One multilingual/code space</text>
    <text x="96" y="544" font-size="20" fill="#475569">• Larger embedding and output head</text>
    <rect x="96" y="588" width="256" height="54" rx="14" fill="#dbeafe"/>
    <text x="224" y="622" text-anchor="middle" font-size="19" font-weight="700" fill="#1d4ed8">tokens → causal sequence</text>

    <line x1="384" y1="440" x2="454" y2="440" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="472" y="205" width="390" height="470" rx="24" fill="#ffffff" stroke="#818cf8" stroke-width="2.5"/>
    </g>
    <text x="506" y="257" font-size="22" font-weight="700" fill="#4f46e5">PRE-TRAINED FOUNDATION</text>
    <rect x="506" y="292" width="322" height="104" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <text x="667" y="335" text-anchor="middle" font-size="29" font-weight="700" fill="#111827">Decoder-only Transformer</text>
    <text x="667" y="369" text-anchor="middle" font-size="19" fill="#475569">causal next-token prediction</text>
    <g font-size="20" font-weight="700" text-anchor="middle">
      <rect x="506" y="432" width="146" height="62" rx="14" fill="#e0e7ff"/>
      <text x="579" y="470" fill="#3730a3">MHA + QKV bias</text>
      <rect x="682" y="432" width="146" height="62" rx="14" fill="#e0e7ff"/>
      <text x="755" y="470" fill="#3730a3">RoPE</text>
      <rect x="506" y="520" width="146" height="62" rx="14" fill="#ecfdf5"/>
      <text x="579" y="558" fill="#047857">Pre-RMSNorm</text>
      <rect x="682" y="520" width="146" height="62" rx="14" fill="#ecfdf5"/>
      <text x="755" y="558" fill="#047857">SwiGLU FFN</text>
    </g>
    <text x="667" y="632" text-anchor="middle" font-size="20" font-weight="700" fill="#4338ca">up to ≈3T training tokens</text>

    <line x1="862" y1="440" x2="934" y2="440" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="952" y="182" width="584" height="516" rx="24" fill="#ffffff" stroke="#a78bfa" stroke-width="2.5"/>
    </g>
    <text x="986" y="235" font-size="22" font-weight="700" fill="#7c3aed">FIRST-GENERATION ALIGNMENT</text>
    <rect x="996" y="278" width="204" height="94" rx="17" fill="#e0e7ff" stroke="#818cf8" stroke-width="2"/>
    <text x="1098" y="316" text-anchor="middle" font-size="25" font-weight="700" fill="#312e81">SFT</text>
    <text x="1098" y="347" text-anchor="middle" font-size="18" fill="#475569">instruction behavior</text>
    <rect x="1288" y="278" width="204" height="94" rx="17" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="1390" y="316" text-anchor="middle" font-size="25" font-weight="700" fill="#334155">RM / PMP</text>
    <text x="1390" y="347" text-anchor="middle" font-size="18" fill="#475569">preference signal</text>
    <path d="M1200 325 H1274" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M1098 372 V439 H1244" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M1390 372 V439 H1300" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="1104" y="421" width="280" height="104" rx="18" fill="#fef9c3" stroke="#eab308" stroke-width="2.5"/>
    <text x="1244" y="464" text-anchor="middle" font-size="27" font-weight="700" fill="#713f12">PPO RLHF</text>
    <text x="1244" y="498" text-anchor="middle" font-size="19" fill="#475569">online policy update + KL control</text>
    <rect x="1012" y="566" width="464" height="86" rx="16" fill="#faf5ff" stroke="#c4b5fd"/>
    <text x="1244" y="600" text-anchor="middle" font-size="20" font-weight="700" fill="#6b21a8">What later generations simplify</text>
    <text x="1244" y="630" text-anchor="middle" font-size="18" fill="#475569">DPO shortens the RM → rollout → PPO chain.</text>

    <rect x="64" y="746" width="1472" height="96" rx="20" fill="#e0e7ff" stroke="#a5b4fc"/>
    <text x="100" y="786" font-size="22" font-weight="700" fill="#3730a3">Reading rule</text>
    <text x="100" y="819" font-size="21" fill="#334155">Backbone design controls representation and compute; post-training controls assistant behavior and the reward proxy being optimized.</text>
  </g>
</svg>
