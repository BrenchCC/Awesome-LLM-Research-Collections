<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Three loops from a SkillRL failure to a reusable skill</title>
  <desc id="desc">A side-by-side view of the data-construction loop, reinforcement-learning loop, and a proposed production admission gate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#eef2f8"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#26334d" flood-opacity="0.10"/></filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f6fed"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d97706"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#138a63"/></marker>
    <style>
      .title{font:700 38px Inter,Arial,sans-serif;fill:#172033}.subtitle{font:400 18px Inter,Arial,sans-serif;fill:#61708a}.panel-title{font:700 23px Inter,Arial,sans-serif;fill:#172033}.panel-note{font:500 13.5px Inter,Arial,sans-serif;fill:#6b7790}.node-title{font:700 14px Inter,Arial,sans-serif;fill:#202a40}.node-text{font:400 12px Inter,Arial,sans-serif;fill:#526078}.small{font:500 11.5px Inter,Arial,sans-serif;fill:#6a7892}.badge{font:700 13px Inter,Arial,sans-serif}.panel{fill:#fff;stroke:#dfe5ef;stroke-width:1.5;filter:url(#shadow)}.node{fill:#f8fafc;stroke:#dce3ee;stroke-width:1.5}.arrow-blue{fill:none;stroke:#2f6fed;stroke-width:3;marker-end:url(#arrow-blue)}.arrow-orange{fill:none;stroke:#d97706;stroke-width:3;marker-end:url(#arrow-orange)}.arrow-green{fill:none;stroke:#138a63;stroke-width:3;marker-end:url(#arrow-green)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="70" y="68" class="title">From One Failure to a Reusable Skill</text>
  <text x="70" y="101" class="subtitle">SkillRL's training loops, plus the admission loop still needed in production</text>

  <g transform="translate(55 135)">
    <rect class="panel" width="480" height="700" rx="26"/><rect x="28" y="26" width="118" height="30" rx="15" fill="#e8f0ff"/><text x="87" y="47" text-anchor="middle" class="badge" fill="#2f6fed">DATA LOOP</text>
    <text x="28" y="92" class="panel-title">Data Construction</text><text x="28" y="120" class="panel-note">Failures define boundaries; successes supply outputs</text>
    <rect class="node" x="45" y="155" width="390" height="62" rx="16"/><text x="68" y="181" class="node-title">Parse and deduplicate rollouts</text><text x="68" y="203" class="node-text">state, action, feedback, outcome → trajectory</text><path class="arrow-blue" d="M240 217 L240 247"/>
    <rect x="45" y="250" width="185" height="120" rx="16" fill="#ecf8f3" stroke="#b8e2d3" stroke-width="1.5"/><text x="66" y="280" class="node-title">Successful trajectory</text><text x="66" y="306" class="node-text">critical decisions</text><text x="66" y="328" class="node-text">why actions worked</text><text x="66" y="350" class="node-text">transferable patterns</text>
    <rect x="250" y="250" width="185" height="120" rx="16" fill="#fff5e8" stroke="#f0cc9b" stroke-width="1.5"/><text x="271" y="280" class="node-title">Failed trajectory</text><text x="271" y="306" class="node-text">failure point · root cause</text><text x="271" y="328" class="node-text">alternative action</text><text x="271" y="350" class="node-text">scope / boundary</text>
    <path class="arrow-blue" d="M137 370 C137 410 190 405 210 425"/><path class="arrow-orange" d="M343 370 C343 410 290 405 270 425"/>
    <rect class="node" x="45" y="425" width="390" height="70" rx="16"/><text x="68" y="454" class="node-title">Per-trajectory memory</text><text x="68" y="478" class="node-text">pruned success path; failure → mistakes_to_avoid</text><path class="arrow-blue" d="M240 495 L240 525"/>
    <rect x="45" y="528" width="390" height="70" rx="16" fill="#edf3ff" stroke="#b9cdf8" stroke-width="1.5"/><text x="68" y="557" class="node-title">Aggregate the SkillBank</text><text x="68" y="581" class="node-text">general + task-specific skills + mistakes</text><path class="arrow-blue" d="M240 598 L240 625"/>
    <rect class="node" x="45" y="628" width="390" height="48" rx="14"/><text x="240" y="658" text-anchor="middle" class="node-title">skill-aware successes → {instruction, output}</text>
  </g>

  <g transform="translate(560 135)">
    <rect class="panel" width="480" height="700" rx="26"/><rect x="28" y="26" width="104" height="30" rx="15" fill="#fff1df"/><text x="80" y="47" text-anchor="middle" class="badge" fill="#d97706">RL LOOP</text>
    <text x="28" y="92" class="panel-title">Policy–SkillBank Co-evolution</text><text x="28" y="120" class="panel-note">cold-start SFT → GRPO → failure feedback</text>
    <rect x="45" y="155" width="390" height="62" rx="16" fill="#fff5e8" stroke="#f0cc9b" stroke-width="1.5"/><text x="68" y="181" class="node-title">Cold-start SFT</text><text x="68" y="203" class="node-text">learn skill use and establish πref</text><path class="arrow-orange" d="M240 217 L240 247"/>
    <rect class="node" x="45" y="250" width="390" height="62" rx="16"/><text x="68" y="276" class="node-title">Retrieve skills; sample G full trajectories</text><text x="68" y="298" class="node-text">task + general skills + retrieved skills</text><path class="arrow-orange" d="M240 312 L240 342"/>
    <rect class="node" x="45" y="345" width="390" height="80" rx="16"/><text x="68" y="373" class="node-title">Binary outcome reward, group normalization</text><text x="68" y="397" class="node-text">Ri ∈ {0,1}; Ai = (Ri − mean(R)) / std(R)</text><path class="arrow-orange" d="M240 425 L240 455"/>
    <rect x="45" y="458" width="390" height="72" rx="16" fill="#fff5e8" stroke="#f0cc9b" stroke-width="1.5"/><text x="68" y="486" class="node-title">GRPO policy update</text><text x="68" y="510" class="node-text">PPO-style clipping + KL(πθ || πref)</text><path class="arrow-orange" d="M240 530 L240 560"/>
    <rect class="node" x="45" y="563" width="390" height="80" rx="16"/><text x="68" y="591" class="node-title">Low-success categories trigger analysis</text><text x="68" y="615" class="node-text">propose skills or refinements; update SkillBank</text><path class="arrow-orange" d="M45 603 C5 603 5 282 45 282"/><text x="26" y="450" class="small" transform="rotate(-90 26 450)">recursive evolution</text>
    <rect x="45" y="660" width="390" height="24" rx="12" fill="#f4f6fa"/><text x="240" y="677" text-anchor="middle" class="small">paper: validation failures; recommended script: train batch</text>
  </g>

  <g transform="translate(1065 135)">
    <rect class="panel" width="480" height="700" rx="26"/><rect x="28" y="26" width="132" height="30" rx="15" fill="#e6f6f0"/><text x="94" y="47" text-anchor="middle" class="badge" fill="#138a63">PROD GATE</text>
    <text x="28" y="92" class="panel-title">Production Admission</text><text x="28" y="120" class="panel-note">Proposed here; not implemented by SkillRL</text>
    <rect x="45" y="155" width="390" height="64" rx="16" fill="#eaf7f2" stroke="#b5dfcf" stroke-width="1.5"/><text x="68" y="181" class="node-title">Candidate skill + provenance</text><text x="68" y="204" class="node-text">source, environment version, scope, generator version</text><path class="arrow-green" d="M240 219 L240 246"/>
    <rect class="node" x="45" y="249" width="390" height="54" rx="15"/><text x="68" y="282" class="node-title">Semantic deduplication and conflict checks</text><path class="arrow-green" d="M240 303 L240 330"/>
    <rect class="node" x="45" y="333" width="390" height="54" rx="15"/><text x="68" y="366" class="node-title">Held-out probes: new states and tasks</text><path class="arrow-green" d="M240 387 L240 414"/>
    <rect class="node" x="45" y="417" width="390" height="70" rx="15"/><text x="68" y="446" class="node-title">Paired evaluation</text><text x="68" y="470" class="node-text">old skill / new skill / no skill; control sampling noise</text><path class="arrow-green" d="M240 487 L240 514"/>
    <rect class="node" x="45" y="517" width="390" height="54" rx="15"/><text x="68" y="550" class="node-title">Canary: low traffic, observable, reversible</text><path class="arrow-green" d="M240 571 L240 598"/>
    <rect x="45" y="601" width="185" height="62" rx="16" fill="#eaf7f2" stroke="#b5dfcf" stroke-width="1.5"/><text x="137" y="638" text-anchor="middle" class="node-title" fill="#0d7251">Promote + version</text>
    <rect x="250" y="601" width="185" height="62" rx="16" fill="#fff0f0" stroke="#efc1c1" stroke-width="1.5"/><text x="342" y="629" text-anchor="middle" class="node-title" fill="#b54747">Rollback / quarantine</text><text x="342" y="651" text-anchor="middle" class="node-text">expiry cleanup</text>
    <path d="M435 450 C470 450 470 632 435 632" fill="none" stroke="#c85b5b" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-orange)"/><text x="456" y="543" class="small" transform="rotate(90 456 543)">any gate fails</text>
  </g>
</svg>
