<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; fill: #17233c; }
      .subtitle { font: 400 18px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; fill: #5b6475; }
      .prompt { font: 600 19px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; fill: #17233c; }
      .step { font: 700 17px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; fill: #17233c; }
      .copy { font: 400 14px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; fill: #465064; }
      .badge { font: 700 13px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; fill: #ffffff; }
      .note { font: 600 16px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; fill: #714b25; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7d8799"/>
    </marker>
  </defs>
  <rect width="1400" height="760" rx="28" fill="#f7f8fb"/>
  <text x="64" y="66" class="title">One Sentence Triggers the Skill; It Does Not Trigger a Blind Run</text>
  <text x="64" y="100" class="subtitle">Repository commit 890b66a: clear the environment gate and business questions before clustering</text>

  <rect x="64" y="136" width="1272" height="108" rx="20" fill="#ffffff" stroke="#dfe3eb" stroke-width="2"/>
  <rect x="88" y="158" width="130" height="28" rx="14" fill="#8463b8"/>
  <text x="153" y="178" class="badge" text-anchor="middle">Suggested prompt</text>
  <text x="88" y="218" class="prompt">“Cluster the text column in data.xlsx into a topic hierarchy. Goal: content distribution. Use bge-m3.”</text>

  <g transform="translate(64,302)">
    <rect width="224" height="214" rx="20" fill="#f0f2f6" stroke="#788397" stroke-width="2"/>
    <circle cx="32" cy="34" r="18" fill="#788397"/>
    <text x="32" y="39" class="badge" text-anchor="middle">1</text>
    <text x="60" y="41" class="step">Match the intent</text>
    <text x="24" y="82" class="copy">Hierarchical/topic clustering</text>
    <text x="24" y="108" class="copy">Clio clustering/topic discovery</text>
    <text x="24" y="148" class="copy">A vague request to “summarize”</text>
    <text x="24" y="174" class="copy">does not trigger this skill</text>
  </g>
  <path d="M298 409 H330" stroke="#7d8799" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(340,302)">
    <rect width="224" height="214" rx="20" fill="#fff1eb" stroke="#d96d4d" stroke-width="2"/>
    <circle cx="32" cy="34" r="18" fill="#d96d4d"/>
    <text x="32" y="39" class="badge" text-anchor="middle">2</text>
    <text x="60" y="41" class="step">Python env gate</text>
    <text x="24" y="82" class="copy">Valid project environment:</text>
    <text x="24" y="108" class="copy">read and reuse it</text>
    <text x="24" y="148" class="copy">Otherwise ask conda, uv,</text>
    <text x="24" y="174" class="copy">or venv; write and validate</text>
  </g>
  <path d="M574 409 H606" stroke="#7d8799" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(616,302)">
    <rect width="224" height="214" rx="20" fill="#eaf2ff" stroke="#4d78bd" stroke-width="2"/>
    <circle cx="32" cy="34" r="18" fill="#4d78bd"/>
    <text x="32" y="39" class="badge" text-anchor="middle">3</text>
    <text x="60" y="41" class="step">Complete inputs</text>
    <text x="24" y="82" class="copy">File path and text column</text>
    <text x="24" y="108" class="copy">Clustering goal (mandatory)</text>
    <text x="24" y="134" class="copy">Local model or online API</text>
    <text x="24" y="174" class="copy">Do not ask for base K or levels</text>
  </g>
  <path d="M850 409 H882" stroke="#7d8799" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(892,302)">
    <rect width="224" height="214" rx="20" fill="#e9f7f1" stroke="#3e9271" stroke-width="2"/>
    <circle cx="32" cy="34" r="18" fill="#3e9271"/>
    <text x="32" y="39" class="badge" text-anchor="middle">4</text>
    <text x="60" y="41" class="step">Hybrid execution</text>
    <text x="24" y="82" class="copy">Compute: embed, cluster, export</text>
    <text x="24" y="108" class="copy">Agent: name, propose, assign</text>
    <text x="24" y="134" class="copy">At least 2, at most 6 levels</text>
    <text x="24" y="174" class="copy">Write back one state chain</text>
  </g>
  <path d="M1126 409 H1158" stroke="#7d8799" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(1168,302)">
    <rect width="168" height="214" rx="20" fill="#f3edff" stroke="#8463b8" stroke-width="2"/>
    <circle cx="32" cy="34" r="18" fill="#8463b8"/>
    <text x="32" y="39" class="badge" text-anchor="middle">5</text>
    <text x="60" y="41" class="step">Deliver</text>
    <text x="20" y="88" class="copy">result.xlsx</text>
    <text x="20" y="118" class="copy">report.html</text>
    <text x="20" y="148" class="copy">Interactive UMAP</text>
    <text x="20" y="184" class="copy">Trace hierarchy and cases</text>
  </g>

  <rect x="64" y="570" width="1272" height="112" rx="18" fill="#fff7e9" stroke="#d8a451" stroke-width="2"/>
  <text x="92" y="606" class="note">Practical reading:</text>
  <text x="228" y="606" class="copy">a complete prompt reduces turns, but the agent must not guess the clustering goal.</text>
  <text x="92" y="638" class="copy">Without project environment configuration, it still asks even when path, column, goal, and model are supplied.</text>
  <text x="92" y="666" class="copy">The gate prevents dependencies from landing in the wrong environment and keeps runtime state out of the installed skill.</text>
</svg>
