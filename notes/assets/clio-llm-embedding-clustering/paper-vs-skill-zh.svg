<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <defs>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #17233c; }
      .subtitle { font: 400 18px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #5b6475; }
      .lane { font: 700 24px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #17233c; }
      .box-title { font: 700 18px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #17233c; }
      .box-copy { font: 400 15px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #465064; }
      .note { font: 600 16px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #8a402f; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7d8799"/>
    </marker>
  </defs>
  <rect width="1400" height="720" rx="28" fill="#f7f8fb"/>
  <text x="64" y="64" class="title">Clio 完整管线与当前 Skill 覆盖范围</text>
  <text x="64" y="96" class="subtitle">二者共享语义聚类和 LLM 层级化思想，但输入、隐私控制与交付目标不同</text>

  <text x="64" y="168" class="lane">Clio 论文</text>
  <g transform="translate(64,195)">
    <rect width="190" height="118" rx="18" fill="#fff1eb" stroke="#d96d4d" stroke-width="2"/>
    <text x="22" y="42" class="box-title">原始会话</text>
    <text x="22" y="72" class="box-copy">真实用户流量</text>
    <text x="22" y="94" class="box-copy">可能含私人信息</text>
  </g>
  <path d="M264 254 H307" stroke="#7d8799" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(318,195)">
    <rect width="190" height="118" rx="18" fill="#fff1eb" stroke="#d96d4d" stroke-width="2"/>
    <text x="22" y="42" class="box-title">Facet 摘要</text>
    <text x="22" y="72" class="box-copy">提取任务、语言等属性</text>
    <text x="22" y="94" class="box-copy">提示词主动去隐私</text>
  </g>
  <path d="M518 254 H561" stroke="#7d8799" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(572,195)">
    <rect width="190" height="118" rx="18" fill="#eaf2ff" stroke="#4d78bd" stroke-width="2"/>
    <text x="22" y="42" class="box-title">Embedding + k-means</text>
    <text x="22" y="72" class="box-copy">形成大量 base 簇</text>
    <text x="22" y="94" class="box-copy">过滤小用户群</text>
  </g>
  <path d="M772 254 H815" stroke="#7d8799" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(826,195)">
    <rect width="190" height="118" rx="18" fill="#e9f7f1" stroke="#3e9271" stroke-width="2"/>
    <text x="22" y="42" class="box-title">LLM 层级化</text>
    <text x="22" y="72" class="box-copy">命名、候选、分配</text>
    <text x="22" y="94" class="box-copy">生成多层 taxonomy</text>
  </g>
  <path d="M1026 254 H1069" stroke="#7d8799" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(1080,195)">
    <rect width="240" height="118" rx="18" fill="#fff1eb" stroke="#d96d4d" stroke-width="2"/>
    <text x="22" y="42" class="box-title">隐私审计与分析界面</text>
    <text x="22" y="72" class="box-copy">聚合阈值、summary 审计</text>
    <text x="22" y="94" class="box-copy">Map / Tree / facet 探索</text>
  </g>

  <text x="64" y="390" class="lane">llm-embedding-clustering Skill</text>
  <g transform="translate(64,418)">
    <rect width="244" height="118" rx="18" fill="#f0f2f6" stroke="#788397" stroke-width="2"/>
    <text x="22" y="42" class="box-title">现成短文本</text>
    <text x="22" y="72" class="box-copy">CSV / Excel / JSON</text>
    <text x="22" y="94" class="box-copy">不负责会话隐私摘要</text>
  </g>
  <path d="M318 477 H361" stroke="#7d8799" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(372,418)">
    <rect width="244" height="118" rx="18" fill="#eaf2ff" stroke="#4d78bd" stroke-width="2"/>
    <text x="22" y="42" class="box-title">bge-m3 + base 聚类</text>
    <text x="22" y="72" class="box-copy">L2 归一化 embedding</text>
    <text x="22" y="94" class="box-copy">k-means / HDBSCAN</text>
  </g>
  <path d="M626 477 H669" stroke="#7d8799" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(680,418)">
    <rect width="244" height="118" rx="18" fill="#e9f7f1" stroke="#3e9271" stroke-width="2"/>
    <text x="22" y="42" class="box-title">Agent 执行语义合并</text>
    <text x="22" y="72" class="box-copy">命名、提议、去重、分配</text>
    <text x="22" y="94" class="box-copy">判断 target_n 与停止</text>
  </g>
  <path d="M934 477 H977" stroke="#7d8799" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(988,418)">
    <rect width="332" height="118" rx="18" fill="#f3edff" stroke="#8463b8" stroke-width="2"/>
    <text x="22" y="42" class="box-title">工程交付</text>
    <text x="22" y="72" class="box-copy">Excel + HTML 报告 + UMAP</text>
    <text x="22" y="94" class="box-copy">便于检查簇、层级与 case</text>
  </g>

  <rect x="64" y="586" width="1256" height="78" rx="16" fill="#fff4ef" stroke="#d96d4d" stroke-width="2"/>
  <text x="92" y="618" class="note">边界：</text>
  <text x="150" y="618" class="box-copy">当前 skill 没有实现用户级聚合阈值、隐私摘要提示词和 privacy auditor，</text>
  <text x="92" y="646" class="box-copy">因此只能称为「Clio 风格的分层语义聚类」，不能继承论文的隐私保证。</text>
</svg>
