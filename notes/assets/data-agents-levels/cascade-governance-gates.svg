<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Cascade errors and governance gates in a data-agent pipeline</title>
  <desc id="desc">A pipeline from data discovery to published artifact shows how an early schema error can amplify downstream. Five governance gates cover provenance, policy validation, human approval, audit, and rollback.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#486581"/>
    </marker>
    <marker id="redarrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#c53030"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#102a43" flood-opacity=".12"/>
    </filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .stage{fill:#fff;stroke:#bcccdc;stroke-width:2}
      .head{font-size:25px;font-weight:800;fill:#102a43}
      .copy{font-size:18px;fill:#486581}
      .gate{font-size:20px;font-weight:800;fill:#243b53}
      .gatecopy{font-size:15px;fill:#486581}
      .risk{font-size:18px;font-weight:800;fill:#c53030}
    </style>
  </defs>
  <rect width="1600" height="920" rx="28" fill="#f7fafc"/>
  <text x="60" y="70" class="sans" font-size="36" font-weight="800" fill="#102a43">CASCADE ERRORS REQUIRE GOVERNANCE GATES</text>
  <text x="60" y="108" class="sans" font-size="21" fill="#627d98">A plausible final report can hide an error introduced several stages earlier</text>

  <g class="sans" filter="url(#shadow)">
    <rect class="stage" x="60" y="180" width="250" height="176" rx="22"/>
    <rect class="stage" x="365" y="180" width="250" height="176" rx="22"/>
    <rect class="stage" x="670" y="180" width="250" height="176" rx="22"/>
    <rect class="stage" x="975" y="180" width="250" height="176" rx="22"/>
    <rect class="stage" x="1280" y="180" width="250" height="176" rx="22"/>
    <text x="185" y="232" text-anchor="middle" class="head">DISCOVER</text>
    <text x="185" y="273" text-anchor="middle" class="copy">select tables</text><text x="185" y="303" text-anchor="middle" class="copy">infer schema</text>
    <text x="490" y="232" text-anchor="middle" class="head">PREPARE</text>
    <text x="490" y="273" text-anchor="middle" class="copy">clean · join</text><text x="490" y="303" text-anchor="middle" class="copy">transform</text>
    <text x="795" y="232" text-anchor="middle" class="head">MODEL</text>
    <text x="795" y="273" text-anchor="middle" class="copy">fit · compare</text><text x="795" y="303" text-anchor="middle" class="copy">select</text>
    <text x="1100" y="232" text-anchor="middle" class="head">INTERPRET</text>
    <text x="1100" y="273" text-anchor="middle" class="copy">estimate effects</text><text x="1100" y="303" text-anchor="middle" class="copy">write claims</text>
    <text x="1405" y="232" text-anchor="middle" class="head">PUBLISH</text>
    <text x="1405" y="273" text-anchor="middle" class="copy">report · dashboard</text><text x="1405" y="303" text-anchor="middle" class="copy">configuration</text>
  </g>
  <g stroke="#486581" stroke-width="5" marker-end="url(#arrow)">
    <path d="M310 268h48"/><path d="M615 268h48"/><path d="M920 268h48"/><path d="M1225 268h48"/>
  </g>

  <g class="sans">
    <path d="M184 388C400 430 1260 430 1404 388" fill="none" stroke="#c53030" stroke-width="8" marker-end="url(#redarrow)"/>
    <circle cx="185" cy="390" r="16" fill="#c53030"/>
    <text x="185" y="446" text-anchor="middle" class="risk">wrong join key</text>
    <text x="490" y="446" text-anchor="middle" class="risk">biased sample</text>
    <text x="795" y="446" text-anchor="middle" class="risk">misleading metric</text>
    <text x="1100" y="446" text-anchor="middle" class="risk">confident claim</text>
    <text x="1405" y="446" text-anchor="middle" class="risk">material action</text>
    <text x="795" y="492" text-anchor="middle" font-size="20" font-weight="700" fill="#c53030">ERROR IMPACT AMPLIFIES ACROSS THE PIPELINE</text>
  </g>

  <g class="sans" filter="url(#shadow)">
    <rect x="60" y="552" width="270" height="202" rx="22" fill="#edf7ee" stroke="#74b98b" stroke-width="2"/>
    <rect x="362" y="552" width="270" height="202" rx="22" fill="#e9f5fb" stroke="#65a9cf" stroke-width="2"/>
    <rect x="664" y="552" width="270" height="202" rx="22" fill="#fff6df" stroke="#e8ad3d" stroke-width="2"/>
    <rect x="966" y="552" width="270" height="202" rx="22" fill="#f3ebfb" stroke="#9c7ac3" stroke-width="2"/>
    <rect x="1268" y="552" width="270" height="202" rx="22" fill="#fcebea" stroke="#d87979" stroke-width="2"/>
    <circle cx="105" cy="602" r="24" fill="#2f855a"/><text x="105" y="610" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">1</text>
    <circle cx="407" cy="602" r="24" fill="#1f77b4"/><text x="407" y="610" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">2</text>
    <circle cx="709" cy="602" r="24" fill="#d69e2e"/><text x="709" y="610" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">3</text>
    <circle cx="1011" cy="602" r="24" fill="#7b61a8"/><text x="1011" y="610" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">4</text>
    <circle cx="1313" cy="602" r="24" fill="#c53030"/><text x="1313" y="610" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">5</text>
    <text x="95" y="654" class="gate">PROVENANCE</text>
    <text x="95" y="690" class="gatecopy">source · version · lineage</text><text x="95" y="718" class="gatecopy">evidence bound to output</text>
    <text x="397" y="654" class="gate">POLICY CHECK</text>
    <text x="397" y="690" class="gatecopy">permissions · PII · residency</text><text x="397" y="718" class="gatecopy">reject invalid action early</text>
    <text x="699" y="654" class="gate">HUMAN APPROVAL</text>
    <text x="699" y="690" class="gatecopy">material change · uncertainty</text><text x="699" y="718" class="gatecopy">explicit approval boundary</text>
    <text x="1001" y="654" class="gate">AUDIT</text>
    <text x="1001" y="690" class="gatecopy">plan · calls · snapshots</text><text x="1001" y="718" class="gatecopy">reconstruct every decision</text>
    <text x="1303" y="654" class="gate">ROLLBACK</text>
    <text x="1303" y="690" class="gatecopy">reversible writes · checkpoints</text><text x="1303" y="718" class="gatecopy">restore known-good state</text>
  </g>
  <path d="M1403 774v58H950V366" fill="none" stroke="#2f855a" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#arrow)"/>
  <text x="1088" y="826" class="sans" font-size="19" font-weight="800" fill="#2f855a">FAILED CHECK → STOP, EXPLAIN, AND REPLAN</text>
  <text x="800" y="882" text-anchor="middle" class="sans" font-size="20" fill="#627d98">Governance is part of the control loop, not a compliance report appended after execution.</text>
</svg>
