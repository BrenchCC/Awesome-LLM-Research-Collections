<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title" lang="zh">
<title id="title">条件训练：从轨迹样本到策略更新</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#557889"/></marker></defs>
<rect width="1200" height="620" rx="20" fill="#f8fbfd"/>
<g font-family="Noto Sans CJK SC, PingFang SC, Arial, sans-serif"><text x="40" y="55" font-size="31" fill="#18334a">条件训练：从轨迹样本到策略更新</text><text x="40" y="97" font-size="21" fill="#526a7c">本文教学方案；不声称复现任何厂商配方</text><rect x="40" y="135" width="350" height="170" rx="16" fill="#eaf3f8" stroke="#bfd0dc"/><text x="58" y="174" font-size="26" fill="#18334a">1  样本与验证</text><text x="58" y="214" font-size="21" fill="#18334a">同题覆盖多个条件</text><text x="58" y="247" font-size="21" fill="#18334a">验证答案和有效解法</text><path d="M 393 220 L 424 220" stroke="#557889" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="430" y="135" width="350" height="170" rx="16" fill="#eaf3f8" stroke="#bfd0dc"/><text x="448" y="174" font-size="26" fill="#18334a">2  条件 SFT</text><text x="448" y="214" font-size="21" fill="#18334a">输入 x, e, B</text><text x="448" y="247" font-size="21" fill="#18334a">监督模型应生成的 token</text><path d="M 783 220 L 814 220" stroke="#557889" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="820" y="135" width="350" height="170" rx="16" fill="#eaf3f8" stroke="#bfd0dc"/><text x="838" y="174" font-size="26" fill="#18334a">3  条件 rollout</text><text x="838" y="214" font-size="21" fill="#18334a">固定 x, e, B 采样一组</text><text x="838" y="247" font-size="21" fill="#18334a">保留真实前缀与 log-prob</text><rect x="40" y="360" width="350" height="170" rx="16" fill="#e8f4ed" stroke="#bfd0dc"/><text x="58" y="399" font-size="26" fill="#18334a">4  奖励与优势</text><text x="58" y="439" font-size="21" fill="#18334a">任务质量 + 成本约束</text><text x="58" y="472" font-size="21" fill="#18334a">组内比较；零方差不更新</text><path d="M 393 445 L 424 445" stroke="#557889" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="430" y="360" width="350" height="170" rx="16" fill="#e8f4ed" stroke="#bfd0dc"/><text x="448" y="399" font-size="26" fill="#18334a">5  策略更新</text><text x="448" y="439" font-size="21" fill="#18334a">只更新模型采样的动作</text><text x="448" y="472" font-size="21" fill="#18334a">外部插入 token 的 mask = 0</text><path d="M 783 445 L 814 445" stroke="#557889" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="820" y="360" width="350" height="170" rx="16" fill="#e8f4ed" stroke="#bfd0dc"/><text x="838" y="399" font-size="26" fill="#18334a">6  分层评估</text><text x="838" y="439" font-size="21" fill="#18334a">难度 × 档位 × 控制器</text><text x="838" y="472" font-size="21" fill="#18334a">质量、超预算、自然停止</text><path d="M 1110 309 L 1110 334 L 60 334 L 60 352" stroke="#557889" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="40" y="580" font-size="23" fill="#18334a">插入信号仍属于后续 token 的上下文；mask = 0 不等于删除上下文。</text></g></svg>