<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title" lang="en">
<title id="title">Reasoning effort: condition, policy, and runtime</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#557889"/></marker></defs>
<rect width="1200" height="620" rx="20" fill="#f8fbfd"/>
<g font-family="Noto Sans CJK SC, PingFang SC, Arial, sans-serif"><text x="40" y="55" font-size="31" fill="#18334a">Reasoning effort: condition, policy, and runtime</text><text x="40" y="96" font-size="21" fill="#526a7c">Conceptual mechanism; not a disclosed commercial implementation</text><rect x="40" y="145" width="250" height="165" rx="16" fill="#eaf3f8" stroke="#bfd0dc"/><text x="58" y="184" font-size="26" fill="#18334a">Request</text><text x="58" y="224" font-size="21" fill="#18334a">Task x · effort e</text><text x="58" y="257" font-size="21" fill="#18334a">Optional budget B</text><path d="M 292 227 L 326 227" stroke="#557889" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="335" y="145" width="250" height="165" rx="16" fill="#eaf3f8" stroke="#bfd0dc"/><text x="353" y="184" font-size="26" fill="#18334a">Conditional policy</text><text x="353" y="224" font-size="21" fill="#18334a">Shared weights θ</text><text x="353" y="257" font-size="21" fill="#18334a">Solve / check / revise</text><path d="M 587 227 L 621 227" stroke="#557889" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="630" y="145" width="250" height="165" rx="16" fill="#eaf3f8" stroke="#bfd0dc"/><text x="648" y="184" font-size="26" fill="#18334a">Runtime</text><text x="648" y="224" font-size="21" fill="#18334a">Metering and stops</text><text x="648" y="257" font-size="21" fill="#18334a">Optional budget cues</text><path d="M 882 227 L 916 227" stroke="#557889" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="925" y="145" width="250" height="165" rx="16" fill="#eaf3f8" stroke="#bfd0dc"/><text x="943" y="184" font-size="26" fill="#18334a">Observations</text><text x="943" y="224" font-size="21" fill="#18334a">Answer correctness</text><text x="943" y="257" font-size="21" fill="#18334a">Length · cost · latency</text><rect x="40" y="360" width="545" height="160" rx="16" fill="#e8f4ed" stroke="#bfd0dc"/><text x="58" y="399" font-size="26" fill="#18334a">Training</text><text x="58" y="439" font-size="21" fill="#18334a">SFT: learn behavior conditioned on effort</text><text x="58" y="472" font-size="21" fill="#18334a">RL: optimize task quality and compute</text><rect x="615" y="360" width="545" height="160" rx="16" fill="#fff2df" stroke="#bfd0dc"/><text x="633" y="399" font-size="26" fill="#18334a">Control boundary</text><text x="633" y="439" font-size="21" fill="#18334a">Soft rewards shape behavior; hard caps stop it</text><text x="633" y="472" font-size="21" fill="#18334a">Product routing needs separate evidence</text><text x="40" y="577" font-size="24" fill="#18334a">The same effort can stop earlier on a simpler task or a completed solution.</text></g></svg>