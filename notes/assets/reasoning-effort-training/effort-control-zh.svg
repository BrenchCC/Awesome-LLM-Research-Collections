<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title" lang="zh">
<title id="title">思考档位：条件、策略与运行时</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#557889"/></marker></defs>
<rect width="1200" height="620" rx="20" fill="#f8fbfd"/>
<g font-family="Noto Sans CJK SC, PingFang SC, Arial, sans-serif"><text x="40" y="55" font-size="31" fill="#18334a">思考档位：条件、策略与运行时</text><text x="40" y="96" font-size="21" fill="#526a7c">机制示意；不代表特定商业产品的内部实现</text><rect x="40" y="145" width="250" height="165" rx="16" fill="#eaf3f8" stroke="#bfd0dc"/><text x="58" y="184" font-size="26" fill="#18334a">请求条件</text><text x="58" y="224" font-size="21" fill="#18334a">题目 x · 档位 e</text><text x="58" y="257" font-size="21" fill="#18334a">可选预算 B</text><path d="M 292 227 L 326 227" stroke="#557889" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="335" y="145" width="250" height="165" rx="16" fill="#eaf3f8" stroke="#bfd0dc"/><text x="353" y="184" font-size="26" fill="#18334a">条件策略</text><text x="353" y="224" font-size="21" fill="#18334a">同一组参数 θ</text><text x="353" y="257" font-size="21" fill="#18334a">生成 / 核验 / 转向</text><path d="M 587 227 L 621 227" stroke="#557889" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="630" y="145" width="250" height="165" rx="16" fill="#eaf3f8" stroke="#bfd0dc"/><text x="648" y="184" font-size="26" fill="#18334a">运行时控制</text><text x="648" y="224" font-size="21" fill="#18334a">统计用量与终止</text><text x="648" y="257" font-size="21" fill="#18334a">可插入预算信号</text><path d="M 882 227 L 916 227" stroke="#557889" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="925" y="145" width="250" height="165" rx="16" fill="#eaf3f8" stroke="#bfd0dc"/><text x="943" y="184" font-size="26" fill="#18334a">可观测结果</text><text x="943" y="224" font-size="21" fill="#18334a">答案正确性</text><text x="943" y="257" font-size="21" fill="#18334a">长度 · 成本 · 延迟</text><rect x="40" y="360" width="545" height="160" rx="16" fill="#e8f4ed" stroke="#bfd0dc"/><text x="58" y="399" font-size="26" fill="#18334a">训练侧</text><text x="58" y="439" font-size="21" fill="#18334a">SFT：建立条件与解题方式的关系</text><text x="58" y="472" font-size="21" fill="#18334a">RL：在条件下优化任务质量与成本</text><rect x="615" y="360" width="545" height="160" rx="16" fill="#fff2df" stroke="#bfd0dc"/><text x="633" y="399" font-size="26" fill="#18334a">控制边界</text><text x="633" y="439" font-size="21" fill="#18334a">软奖励影响分布；硬上限约束执行</text><text x="633" y="472" font-size="21" fill="#18334a">产品路由需要独立证据</text><text x="40" y="577" font-size="24" fill="#18334a">同一档位仍可因题目与当前轨迹而提前结束。</text></g></svg>