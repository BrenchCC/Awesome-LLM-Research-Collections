<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title" lang="en">
<title id="title">Conditional training: from traces to policy updates</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#557889"/></marker></defs>
<rect width="1200" height="620" rx="20" fill="#f8fbfd"/>
<g font-family="Noto Sans CJK SC, PingFang SC, Arial, sans-serif"><text x="40" y="55" font-size="31" fill="#18334a">Conditional training: from traces to policy updates</text><text x="40" y="97" font-size="21" fill="#526a7c">Teaching design; not a reconstruction of any vendor recipe</text><rect x="40" y="135" width="350" height="170" rx="16" fill="#eaf3f8" stroke="#bfd0dc"/><text x="58" y="174" font-size="26" fill="#18334a">1  Data and checks</text><text x="58" y="214" font-size="21" fill="#18334a">Multiple conditions per task</text><text x="58" y="247" font-size="21" fill="#18334a">Verify answers and methods</text><path d="M 393 220 L 424 220" stroke="#557889" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="430" y="135" width="350" height="170" rx="16" fill="#eaf3f8" stroke="#bfd0dc"/><text x="448" y="174" font-size="26" fill="#18334a">2  Conditional SFT</text><text x="448" y="214" font-size="21" fill="#18334a">Condition on x, e, B</text><text x="448" y="247" font-size="21" fill="#18334a">Supervise generated tokens</text><path d="M 783 220 L 814 220" stroke="#557889" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="820" y="135" width="350" height="170" rx="16" fill="#eaf3f8" stroke="#bfd0dc"/><text x="838" y="174" font-size="26" fill="#18334a">3  Rollout groups</text><text x="838" y="214" font-size="21" fill="#18334a">Fix x, e, B within a group</text><text x="838" y="247" font-size="21" fill="#18334a">Keep prefixes and log-probs</text><rect x="40" y="360" width="350" height="170" rx="16" fill="#e8f4ed" stroke="#bfd0dc"/><text x="58" y="399" font-size="26" fill="#18334a">4  Rewards / advantages</text><text x="58" y="439" font-size="21" fill="#18334a">Task quality + compute cost</text><text x="58" y="472" font-size="21" fill="#18334a">Skip zero-variance groups</text><path d="M 393 445 L 424 445" stroke="#557889" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="430" y="360" width="350" height="170" rx="16" fill="#e8f4ed" stroke="#bfd0dc"/><text x="448" y="399" font-size="26" fill="#18334a">5  Policy update</text><text x="448" y="439" font-size="21" fill="#18334a">Train sampled actions only</text><text x="448" y="472" font-size="21" fill="#18334a">Inserted cues: mask = 0</text><path d="M 783 445 L 814 445" stroke="#557889" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="820" y="360" width="350" height="170" rx="16" fill="#e8f4ed" stroke="#bfd0dc"/><text x="838" y="399" font-size="26" fill="#18334a">6  Stratified evaluation</text><text x="838" y="439" font-size="21" fill="#18334a">Difficulty × effort × controller</text><text x="838" y="472" font-size="21" fill="#18334a">Quality, overruns, natural stops</text><path d="M 1110 309 L 1110 334 L 60 334 L 60 352" stroke="#557889" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="40" y="580" font-size="23" fill="#18334a">Inserted cues remain in later context; mask = 0 does not remove the context.</text></g></svg>