<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 830" role="img" aria-labelledby="title desc">
  <title id="title">受控变异与合成样本验收</title>
  <desc id="desc">人工金种子经过语言、参数边界、信息缺失、权限、工具故障、多轮和对抗变异，再依次通过语义去重、规则校验、可解性检查、分布检查和人工复核，形成可追溯的覆盖样本。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <rect width="1500" height="830" fill="#ffffff"/>
  <text x="750" y="50" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Seed Case → Mutation Operators → 可验收的合成案例</text>

  <rect x="50" y="130" width="250" height="520" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="175" y="177" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#1e3a8a">Gold Seed</text>
  <rect x="82" y="220" width="186" height="118" rx="12" fill="#dbeafe"/>
  <text x="175" y="253" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a">退款 80 元</text>
  <text x="175" y="281" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1e40af">已支付 · 本人订单</text>
  <text x="175" y="307" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1e40af">最多写入一次</text>
  <text x="175" y="380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">冻结不变量</text>
  <text x="175" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b">业务规则</text>
  <text x="175" y="438" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b">预期世界状态</text>
  <text x="175" y="466" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b">安全边界</text>
  <rect x="82" y="520" width="186" height="74" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="175" y="550" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#991b1b">禁止模型改写</text>
  <text x="175" y="576" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#991b1b">GT 与权限规则</text>

  <rect x="370" y="95" width="450" height="610" rx="20" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="595" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#581c87">允许的 Mutation Operators</text>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="415" y="180" width="170" height="74" rx="12" fill="#ede9fe"/><text x="500" y="210" font-size="16" font-weight="700" fill="#4c1d95">语言表述</text><text x="500" y="234" font-size="13" fill="#6d28d9">口语 · 错别字 · 代称</text>
    <rect x="605" y="180" width="170" height="74" rx="12" fill="#ede9fe"/><text x="690" y="210" font-size="16" font-weight="700" fill="#4c1d95">参数边界</text><text x="690" y="234" font-size="13" fill="#6d28d9">99.99 · 100 · 100.01</text>
    <rect x="415" y="280" width="170" height="74" rx="12" fill="#ede9fe"/><text x="500" y="310" font-size="16" font-weight="700" fill="#4c1d95">信息缺失</text><text x="500" y="334" font-size="13" fill="#6d28d9">订单号 · 金额 · 身份</text>
    <rect x="605" y="280" width="170" height="74" rx="12" fill="#ede9fe"/><text x="690" y="310" font-size="16" font-weight="700" fill="#4c1d95">权限变化</text><text x="690" y="334" font-size="13" fill="#6d28d9">非本人 · 超限 · 过期</text>
    <rect x="415" y="380" width="170" height="74" rx="12" fill="#ede9fe"/><text x="500" y="410" font-size="16" font-weight="700" fill="#4c1d95">工具故障</text><text x="500" y="434" font-size="13" fill="#6d28d9">超时 · 部分成功 · 冲突</text>
    <rect x="605" y="380" width="170" height="74" rx="12" fill="#ede9fe"/><text x="690" y="410" font-size="16" font-weight="700" fill="#4c1d95">多轮用户</text><text x="690" y="434" font-size="13" fill="#6d28d9">慢披露 · 改需求 · 跳题</text>
    <rect x="510" y="480" width="170" height="74" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="595" y="510" font-size="16" font-weight="700" fill="#831843">对抗场景</text><text x="595" y="534" font-size="13" fill="#9d174d">注入 · 越权 · 重复提交</text>
  </g>
  <rect x="435" y="595" width="320" height="66" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="595" y="624" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#9a3412">每次只改指定维度</text>
  <text x="595" y="648" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#9a3412">记录 seed_id 与 mutation_type</text>

  <rect x="900" y="95" width="550" height="610" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="1175" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#14532d">验收链</text>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="975" y="180" width="400" height="70" rx="12" fill="#dcfce7"/><text x="1175" y="210" font-size="17" font-weight="700" fill="#14532d">1. 语义去重</text><text x="1175" y="234" font-size="13" fill="#166534">按目标、状态、风险与预期行为判断</text>
    <rect x="975" y="275" width="400" height="70" rx="12" fill="#dcfce7"/><text x="1175" y="305" font-size="17" font-weight="700" fill="#14532d">2. 规则校验</text><text x="1175" y="329" font-size="13" fill="#166534">程序检查业务不变量与参数边界</text>
    <rect x="975" y="370" width="400" height="70" rx="12" fill="#dcfce7"/><text x="1175" y="400" font-size="17" font-weight="700" fill="#14532d">3. 可解性检查</text><text x="1175" y="424" font-size="13" fill="#166534">参考执行或确定性拒绝能够通过</text>
    <rect x="975" y="465" width="400" height="70" rx="12" fill="#dcfce7"/><text x="1175" y="495" font-size="17" font-weight="700" fill="#14532d">4. 分布检查</text><text x="1175" y="519" font-size="13" fill="#166534">能力 · 工具 · 风险 · 难度 · 变异类型</text>
    <rect x="975" y="560" width="400" height="70" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="1175" y="590" font-size="17" font-weight="700" fill="#065f46">5. 人工复核</text><text x="1175" y="614" font-size="13" fill="#047857">重点审查高风险与开放 rubric</text>
  </g>

  <g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M300,400 L360,400"/><path d="M820,400 L890,400"/></g>
  <rect x="410" y="750" width="680" height="52" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="750" y="783" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0c4a6e">输出：可追溯、可重置、可判分的 Synthetic Coverage Cases</text>
</svg>
