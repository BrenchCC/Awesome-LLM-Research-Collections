<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Controlled ablation plan for the SFT loss weight</title>
  <desc id="desc">Six SFT weights are compared under fixed model, data split, beta, optimization budget, decoding, judge, and random seeds.</desc>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202822; }
    .title { font-family: Georgia, serif; font-size: 36px; font-weight: 700; }
    .subtitle { font-size: 18px; fill: #637068; }
    .head { font-size: 22px; font-weight: 700; }
    .body { font-size: 17px; fill: #46534b; }
    .lambda { font-family: Georgia, serif; font-size: 28px; font-weight: 700; }
    .inverse { fill: #ffffff; }
    .inverse-soft { fill: #dce7e1; }
  </style>
  <rect width="1400" height="760" rx="30" fill="#f7f7f3"/>
  <text x="64" y="72" class="title">Ablate the anchor; keep everything else fixed</text>
  <text x="64" y="108" class="subtitle">The comparison is invalid if checkpoints, decoding, or judges change across λSFT</text>

  <text x="65" y="180" class="head">Sweep</text>
  <g transform="translate(65 210)">
    <g><rect width="185" height="100" rx="18" fill="#ffffff" stroke="#b8c2bc" stroke-width="2"/><text x="92" y="61" text-anchor="middle" class="lambda">0</text></g>
    <g transform="translate(210)"><rect width="185" height="100" rx="18" fill="#f3f7f4" stroke="#9fb7aa" stroke-width="2"/><text x="92" y="61" text-anchor="middle" class="lambda">0.01</text></g>
    <g transform="translate(420)"><rect width="185" height="100" rx="18" fill="#edf6f1" stroke="#82aa95" stroke-width="2"/><text x="92" y="61" text-anchor="middle" class="lambda">0.05</text></g>
    <g transform="translate(630)"><rect width="185" height="100" rx="18" fill="#e6f2ec" stroke="#60977d" stroke-width="2"/><text x="92" y="61" text-anchor="middle" class="lambda">0.10</text></g>
    <g transform="translate(840)"><rect width="185" height="100" rx="18" fill="#e8eef4" stroke="#7894ad" stroke-width="2"/><text x="92" y="61" text-anchor="middle" class="lambda">0.25</text></g>
    <g transform="translate(1050)"><rect width="185" height="100" rx="18" fill="#f1eaf4" stroke="#977ca5" stroke-width="2"/><text x="92" y="61" text-anchor="middle" class="lambda">0.50</text></g>
  </g>

  <text x="65" y="385" class="head">Hold constant</text>
  <g transform="translate(65 415)">
    <rect width="400" height="220" rx="20" fill="#ffffff" stroke="#c4cdc7" stroke-width="2"/>
    <text x="30" y="48" class="body">• policy initialization and reference model</text>
    <text x="30" y="84" class="body">• train/eval preference split</text>
    <text x="30" y="120" class="body">• β, optimizer, batch size, update steps</text>
    <text x="30" y="156" class="body">• checkpoint step and random seeds</text>
    <text x="30" y="192" class="body">• prompt template and max length</text>
  </g>
  <g transform="translate(500 415)">
    <rect width="400" height="220" rx="20" fill="#ffffff" stroke="#c4cdc7" stroke-width="2"/>
    <text x="30" y="48" class="body">• decoding temperature, top-p, max tokens</text>
    <text x="30" y="84" class="body">• judge model/version and rubric</text>
    <text x="30" y="120" class="body">• generation prompt set</text>
    <text x="30" y="156" class="body">• length-controlled evaluation</text>
    <text x="30" y="192" class="body">• bootstrap or multi-seed uncertainty</text>
  </g>
  <g transform="translate(935 415)">
    <rect width="400" height="220" rx="20" fill="#354b40"/>
    <text x="30" y="50" class="head inverse">Decision rule</text>
    <text x="30" y="92" class="body inverse-soft">Keep chosen likelihood stable</text>
    <text x="30" y="126" class="body inverse-soft">without collapsing pair separation,</text>
    <text x="30" y="160" class="body inverse-soft">then require a held-out generation</text>
    <text x="30" y="194" class="body inverse-soft">gain larger than evaluation noise.</text>
  </g>
  <text x="700" y="700" text-anchor="middle" font-size="18" fill="#6a756e">λSFT is a tunable engineering hypothesis, not a universal constant.</text>
</svg>
