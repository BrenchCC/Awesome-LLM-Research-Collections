<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Gate schema validation</title>
  <desc id="desc">Gate rejects incomplete or undeclared fields and accepts data matching the schema.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1440" height="760" rx="28" fill="url(#bg)"/>
  <text x="72" y="78" font-family="PingFang SC, Inter, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Gate 把「是否完成」变成可执行判定</text>
  <text x="72" y="118" font-family="PingFang SC, Inter, sans-serif" font-size="20" fill="#475569">Agent 负责收集语义，CLI 负责验证字段集合与类型。</text>

  <g filter="url(#shadow)">
    <rect x="72" y="176" width="374" height="468" rx="24" fill="#ffffff"/>
    <rect x="533" y="176" width="374" height="468" rx="24" fill="#ffffff"/>
    <rect x="994" y="176" width="374" height="468" rx="24" fill="#ffffff"/>
  </g>

  <rect x="96" y="200" width="326" height="48" rx="12" fill="#fff1f2"/>
  <text x="116" y="232" font-family="PingFang SC, Inter, sans-serif" font-size="20" font-weight="650" fill="#be123c">输入：字段不完整</text>
  <text x="108" y="292" font-family="SFMono-Regular, Menlo, monospace" font-size="18" fill="#334155">{</text>
  <text x="130" y="328" font-family="SFMono-Regular, Menlo, monospace" font-size="18" fill="#334155">"project_name": "权限中心",</text>
  <text x="130" y="364" font-family="SFMono-Regular, Menlo, monospace" font-size="18" fill="#334155">"admins": "brench"</text>
  <text x="108" y="400" font-family="SFMono-Regular, Menlo, monospace" font-size="18" fill="#334155">}</text>
  <rect x="108" y="442" width="302" height="118" rx="16" fill="#fff7ed" stroke="#fdba74"/>
  <text x="130" y="478" font-family="PingFang SC, Inter, sans-serif" font-size="17" font-weight="650" fill="#9a3412">拒绝推进</text>
  <text x="130" y="512" font-family="PingFang SC, Inter, sans-serif" font-size="16" fill="#7c2d12">缺少 required 字段：host</text>
  <text x="130" y="540" font-family="PingFang SC, Inter, sans-serif" font-size="16" fill="#7c2d12">当前步骤保持不变</text>

  <rect x="557" y="200" width="326" height="48" rx="12" fill="#eff6ff"/>
  <text x="577" y="232" font-family="PingFang SC, Inter, sans-serif" font-size="20" font-weight="650" fill="#1d4ed8">Gate schema</text>
  <text x="569" y="292" font-family="SFMono-Regular, Menlo, monospace" font-size="17" fill="#334155">project_name  string  required</text>
  <text x="569" y="334" font-family="SFMono-Regular, Menlo, monospace" font-size="17" fill="#334155">host          string  required</text>
  <text x="569" y="376" font-family="SFMono-Regular, Menlo, monospace" font-size="17" fill="#334155">admins        string  required</text>
  <line x1="569" y1="410" x2="871" y2="410" stroke="#cbd5e1"/>
  <text x="569" y="454" font-family="PingFang SC, Inter, sans-serif" font-size="17" fill="#475569">① 检查必填字段</text>
  <text x="569" y="494" font-family="PingFang SC, Inter, sans-serif" font-size="17" fill="#475569">② 丢弃 schema 外字段</text>
  <text x="569" y="534" font-family="PingFang SC, Inter, sans-serif" font-size="17" fill="#475569">③ 写入 state 后推进</text>

  <rect x="1018" y="200" width="326" height="48" rx="12" fill="#ecfdf5"/>
  <text x="1038" y="232" font-family="PingFang SC, Inter, sans-serif" font-size="20" font-weight="650" fill="#047857">输出：可执行数据</text>
  <text x="1030" y="292" font-family="SFMono-Regular, Menlo, monospace" font-size="17" fill="#334155">{</text>
  <text x="1052" y="328" font-family="SFMono-Regular, Menlo, monospace" font-size="17" fill="#334155">"project_name": "权限中心",</text>
  <text x="1052" y="364" font-family="SFMono-Regular, Menlo, monospace" font-size="17" fill="#334155">"host": "perm.example.com",</text>
  <text x="1052" y="400" font-family="SFMono-Regular, Menlo, monospace" font-size="17" fill="#334155">"admins": "brench"</text>
  <text x="1030" y="436" font-family="SFMono-Regular, Menlo, monospace" font-size="17" fill="#334155">}</text>
  <rect x="1030" y="476" width="302" height="84" rx="16" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="1052" y="510" font-family="PingFang SC, Inter, sans-serif" font-size="17" font-weight="650" fill="#047857">验证通过</text>
  <text x="1052" y="540" font-family="PingFang SC, Inter, sans-serif" font-size="16" fill="#065f46">进入 create-project</text>

  <path d="M446 410 H515" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M907 410 H976" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
