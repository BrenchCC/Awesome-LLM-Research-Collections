<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Workflow state snapshot</title>
  <desc id="desc">A state file records the current step, gate inputs, tool results, and audit status.</desc>
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#162033"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#22c55e"/>
    </marker>
  </defs>
  <rect width="1440" height="820" rx="30" fill="#f1f5f9"/>
  <text x="64" y="70" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">Recovery Depends on External State, Not Session Memory</text>
  <text x="64" y="108" font-family="Inter, Arial, sans-serif" font-size="19" fill="#475569">.state supports both checkpoint recovery and execution auditing.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="154" width="832" height="594" rx="22" fill="url(#left)"/>
    <rect x="940" y="154" width="436" height="594" rx="22" fill="#ffffff"/>
  </g>
  <rect x="64" y="154" width="832" height="58" rx="22" fill="#1e293b"/>
  <rect x="64" y="190" width="832" height="22" fill="#1e293b"/>
  <circle cx="101" cy="183" r="8" fill="#fb7185"/>
  <circle cx="129" cy="183" r="8" fill="#fbbf24"/>
  <circle cx="157" cy="183" r="8" fill="#4ade80"/>
  <text x="480" y="190" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace" font-size="16" fill="#cbd5e1">create-permission-set.state</text>

  <text x="98" y="258" font-family="SFMono-Regular, Menlo, monospace" font-size="18" fill="#c4b5fd">{</text>
  <text x="122" y="294" font-family="SFMono-Regular, Menlo, monospace" font-size="18" fill="#93c5fd">"workflow": "create-permission-set",</text>
  <text x="122" y="330" font-family="SFMono-Regular, Menlo, monospace" font-size="18" fill="#93c5fd">"status": "in_progress",</text>
  <text x="122" y="366" font-family="SFMono-Regular, Menlo, monospace" font-size="18" fill="#fcd34d">"current_step": "collect-role-info",</text>
  <text x="122" y="402" font-family="SFMono-Regular, Menlo, monospace" font-size="18" fill="#86efac">"gates": {</text>
  <text x="150" y="438" font-family="SFMono-Regular, Menlo, monospace" font-size="18" fill="#d1fae5">"collect-project-info": {</text>
  <text x="178" y="474" font-family="SFMono-Regular, Menlo, monospace" font-size="18" fill="#d1fae5">"project_name": "iam",</text>
  <text x="178" y="510" font-family="SFMono-Regular, Menlo, monospace" font-size="18" fill="#d1fae5">"host": "perm.example.com"</text>
  <text x="150" y="546" font-family="SFMono-Regular, Menlo, monospace" font-size="18" fill="#d1fae5">}</text>
  <text x="122" y="582" font-family="SFMono-Regular, Menlo, monospace" font-size="18" fill="#86efac">},</text>
  <text x="122" y="618" font-family="SFMono-Regular, Menlo, monospace" font-size="18" fill="#f9a8d4">"results": {"create-project": {"id": 12345}}</text>
  <text x="98" y="654" font-family="SFMono-Regular, Menlo, monospace" font-size="18" fill="#c4b5fd">}</text>

  <text x="980" y="212" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">When Returning to a Session</text>
  <rect x="980" y="250" width="356" height="72" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="1004" y="280" font-family="SFMono-Regular, Menlo, monospace" font-size="17" fill="#1e3a8a">$ pangu-cli.sh --current</text>
  <text x="1004" y="306" font-family="Inter, Arial, sans-serif" font-size="15" fill="#475569">Read state, not old context</text>
  <path d="M1158 322 V365" fill="none" stroke="#22c55e" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <rect x="980" y="382" width="356" height="120" rx="14" fill="#ecfdf5" stroke="#86efac"/>
  <text x="1004" y="416" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650" fill="#047857">Recovery result</text>
  <text x="1004" y="448" font-family="Inter, Arial, sans-serif" font-size="16" fill="#334155">Project created: id = 12345</text>
  <text x="1004" y="478" font-family="Inter, Arial, sans-serif" font-size="16" fill="#334155">Now waiting for: role info</text>
  <rect x="980" y="542" width="356" height="126" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1004" y="576" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650" fill="#9a3412">Audit value</text>
  <text x="1004" y="608" font-family="Inter, Arial, sans-serif" font-size="16" fill="#334155">Review inputs, results, and position</text>
  <text x="1004" y="638" font-family="Inter, Arial, sans-serif" font-size="16" fill="#334155">Failures map to a specific step</text>
</svg>
